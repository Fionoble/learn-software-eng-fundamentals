   gist:'Strong consistency means every read sees the latest write — simple to reason about, expensive to coordinate. Eventual consistency means replicas converge given time, so a read may be briefly stale — cheaper, more available, and much harder to reason about. Between them sit useful middles like read-your-own-writes and monotonic reads.',
   why:'Choosing per use case rather than globally is a mark of maturity: a bank balance needs strong consistency; a follower count does not, and pretending otherwise costs availability for nothing.',
   deeper:'<p><b>CAP</b> is the famous framing: when the network partitions, you must choose between consistency and availability. The practical version is that partitions are rare but latency is constant, so the everyday trade is really consistency versus speed (sometimes written PACELC).</p><p>The failures users notice are the intuitive ones: posting a comment and not seeing it (no read-your-own-writes), or seeing a value go forwards then backwards (no monotonic reads). Both are fixable with routing tricks — pin the user to a replica, or read from the primary briefly after a write — and both are far cheaper than global strong consistency.</p>',
   rel:['distributed','caching','transactions']},
  {id:'idempotency', term:'Idempotency',
   plain:'Doing it twice has the same effect as doing it once. The property that makes retries safe.',
   gist:'Networks fail ambiguously: a timeout tells you nothing about whether the work happened. Since the client must retry, every operation must tolerate being received more than once. An idempotent operation makes that safe by construction — assigning a value is naturally idempotent, incrementing a counter or charging a card is not.',
   why:'Retries are everywhere and mostly automatic — in clients, queues, proxies, and job runners. Without idempotency, every retry is a potential double charge, and “exactly once” is not something the network can give you.',
   deeper:'<p>The standard implementation is an <b>idempotency key</b>: the caller generates a unique ID per logical operation; the server records it with the result in the same transaction as the effect; a repeat with a known key returns the stored result instead of acting again. Payment APIs work exactly this way, and so should yours.</p><p>Related tools: <b>natural keys</b> and unique constraints (let the database reject the duplicate), <b>conditional updates</b> (compare-and-set on a version), and designing for <b>at-least-once delivery with idempotent consumers</b> — which is how you get effectively-once behavior out of infrastructure that cannot promise it.</p>',
   rel:['failure','messaging','transactions']},
  {id:'sourceoftruth', term:'Source of truth and derived data',
   plain:'For every fact, exactly one place is authoritative. Everything else is a copy that can be rebuilt.',
   gist:'Caches, search indexes, read replicas, materialized views, analytics warehouses and denormalized columns are all derived data. Systems stay comprehensible when it is explicit which store owns each fact and which merely reflects it — and when every derived thing can be regenerated from the source on demand.',
   why:'“Which number is right?” is one of the most corrosive questions an organization can face. It comes from ambiguity about ownership, not from bugs.',
   deeper:'<p>Two disciplines follow. First, <b>derived data must be reproducible</b>: if you cannot rebuild the search index or the cache from the source, it has quietly become a source of truth without the durability guarantees of one. Second, <b>write to the source, then propagate</b> — dual writes to two systems from application code will diverge the first time one call fails.</p><p>This is also the cleanest argument for event-driven design: an ordered log of facts is an excellent source of truth precisely because every other view can be rebuilt by replaying it — which turns a corrupted index from an incident into a chore.</p>',
   rel:['caching','modeling','messaging']},
],
  ex:[
  {id:'x-explain', title:'Read a query plan and fix it', time:'45 min', level:'Keystone',
   plain:'Turn a slow query into a fast one with an index, and prove it with the planner.',
   steps:'<li>Create a table with a million generated rows. Query it with a <code>WHERE</code> on an unindexed column and time it.</li><li>Run <code>EXPLAIN ANALYZE</code> on the same query. Find the sequential scan, the estimated rows, and the actual rows.</li><li>Add the index, rerun both. Watch the scan become an index scan and the time drop by orders of magnitude.</li><li>Now defeat your own index three ways: wrap the column in a function, query the second column of a composite index alone, and use a leading wildcard <code>LIKE</code>. Confirm with the plan each time that the index went unused.</li>',
   hint:'<p>Then measure the cost side: time a bulk insert of 100k rows with and without the index in place. Indexes are not free, and knowing the write penalty is what lets you argue against adding six of them.</p>',
   rel:['indexes','measure','relational']},
  {id:'x-lostupdate', title:'Lose an update on purpose', time:'40 min', level:'Keystone',
   plain:'Make money disappear with two concurrent transactions, then fix it three different ways.',
   steps:'<li>Create an accounts table with a balance. Write a “withdraw” function that reads the balance, subtracts in application code, then writes it back.</li><li>Run it from twenty concurrent workers, ten withdrawals each. Compare the final balance to the arithmetic. Money is missing.</li><li>Fix #1: do it in one statement — <code>UPDATE … SET balance = balance - :amt WHERE balance >= :amt</code>. Fix #2: <code>SELECT … FOR UPDATE</code>. Fix #3: an optimistic version column with a retry loop.</li><li>Re-run the concurrency test on each. Then note which of your existing code paths does read-modify-write and is currently unprotected.</li>',
   rel:['isolation','races','transactions']},
  {id:'x-migration', title:'A zero-downtime rename', time:'50 min', level:'Hands-on',
   plain:'Rename a column in four deploys without ever breaking the running application.',
   steps:'<li>Start with a table and application code that reads and writes <code>full_name</code>. The goal is <code>display_name</code>, with no downtime and rollback available at every step.</li><li>Deploy 1: add <code>display_name</code>, nullable; backfill in batches with a sleep between them.</li><li>Deploy 2: write to both columns, read the old. Deploy 3: read the new, still write both. Deploy 4: stop writing the old, then drop it.</li><li>After each step, verify that the <em>previous</em> version of the code would still work. That property — not the end state — is what makes the migration safe.</li>',
   rel:['migrations','cicd','api']},
  {id:'x-idempotent', title:'Survive the ambiguous timeout', time:'40 min', level:'Hands-on',
   plain:'Build an endpoint that charges once even when the client retries five times.',
   steps:'<li>Write a POST endpoint that records a “charge” row. Add an artificial delay and have the client time out and retry three times. Count the rows — you have three charges.</li><li>Add an idempotency key: the client sends a UUID per logical charge; the server stores key → result in the <em>same transaction</em> as the charge.</li><li>On a repeat key, return the stored result without re-charging. Re-run the retry storm and confirm exactly one row.</li><li>Now try the naive version — check-then-insert in two statements — under concurrency, and watch the race slip through. Only a unique constraint or a single atomic statement actually closes it.</li>',
   rel:['idempotency','failure','transactions']},
]},
{
  numeral:'V', slug:'systems', title:'Systems & Architecture',
  desc:'What changes when one program becomes many, spread across machines, talking over a network that is allowed to fail at any moment.',
  topics:[
  {id:'network', term:'The network, one layer at a time',
   plain:'A URL becomes a DNS lookup, a TCP connection, a TLS handshake, and finally your request.',
   gist:'Layers stack: IP moves packets between machines, TCP adds ordering and reliability on top, TLS adds encryption and identity, HTTP defines the request and response, and your API defines meaning. Each layer has its own failure modes and timeouts, and any of them can be the reason “the call is slow”.',
   why:'Nearly every integration problem — hanging requests, certificate errors, connection resets, mysterious 30-second delays — is one specific layer misbehaving. Naming the layer is most of the fix.',
   deeper:'<p>Facts that explain a lot of production behavior. <b>Connections are expensive to establish</b> (DNS + TCP handshake + TLS handshake can cost several round trips before a byte of yours moves) — which is why connection pooling and keep-alive matter so much. <b>The network can drop, delay, duplicate, and reorder</b>; TCP hides most of that at the cost of head-of-line blocking. <b>Nothing tells you a peer died</b> — you find out by timing out, which is why every network call needs an explicit timeout.</p><p>HTTP specifics worth real fluency: status code families, idempotent versus non-idempotent methods, caching headers, and why HTTP/2 multiplexing changed front-end performance advice that is still repeated from the HTTP/1.1 era.</p>',
   rel:['api','failure','io']},
  {id:'api', term:'API design at the boundary',
   plain:'A public interface you cannot refactor, because you do not control the callers.',
   gist:'Inside a program, a bad interface is a refactor. Across a boundary — public API, service-to-service, a library others depend on — it is a migration involving other people’s calendars. So boundaries deserve disproportionate care: clear resources and verbs, consistent errors, explicit pagination, and versioning planned before you need it.',
   why:'Boundaries are where architecture actually lives. Everything behind one can be rewritten, regenerated, or replaced; the boundary itself is the commitment.',
   deeper:'<p>Style is secondary to consistency: REST (resources and HTTP verbs) is the right default, RPC/gRPC suits high-volume internal calls, GraphQL suits many clients with divergent data needs at the cost of server-side complexity. What matters in all of them is <b>predictability</b> — same shape of error everywhere, same pagination, same date format, no surprises.</p><p>Compatibility rules that keep you out of trouble: <b>adding</b> optional fields is safe, <b>removing or renaming</b> is not; <b>never repurpose</b> an existing field’s meaning; treat unknown fields as ignorable so old clients survive new servers; and version explicitly when you must break, with a stated deprecation window. Design responses to be extensible from day one (an object, not a bare array).</p>',
   rel:['contracts','migrations','monolith']},
  {id:'stateless', term:'Statelessness and horizontal scale',
   plain:'If a server remembers nothing between requests, you can run a hundred of them.',
   gist:'A stateless service keeps no per-client state in memory: everything needed comes with the request or from shared storage. That constraint is what makes it possible to add instances behind a load balancer, restart any of them at any time, and survive the loss of one — none of which is safe when a user’s session lives in one process’s memory.',
   why:'Vertical scale (a bigger machine) runs out; horizontal scale does not. Statelessness is the price of admission, and it is a design decision made early or paid for painfully later.',
   deeper:'<p>State does not vanish, it moves: sessions into a signed token or a shared store, uploads into object storage, background work into a queue, coordination into the database. What remains in process memory should be caches you can lose without harm.</p><p>Related and worth internalizing: <b>sticky sessions</b> are a workaround with a failure mode built in; <b>graceful shutdown</b> (stop accepting, finish in-flight, then exit on SIGTERM) is what makes rolling deploys invisible; and <b>health checks</b> should distinguish liveness (am I broken?) from readiness (can I take traffic now?) or you will restart healthy instances that were merely warming up.</p>',
   rel:['os','failure','cicd']},
  {id:'concurrency', term:'Concurrency vs parallelism',
   plain:'Concurrency is dealing with many things at once; parallelism is doing many at once.',
   gist:'Concurrency is a structuring concept — interleaving independent tasks so progress continues while one waits. Parallelism is a hardware fact — genuinely executing on multiple cores. A single-threaded event loop is highly concurrent and not parallel at all; that is why it handles ten thousand idle connections beautifully and one CPU-heavy computation terribly.',
   why:'The right tool depends entirely on which resource you are waiting for. I/O-bound work wants concurrency; CPU-bound work wants parallelism. Applying the wrong one is the most common concurrency mistake there is.',
   deeper:'<p>The models you will meet: <b>threads</b> (shared memory, OS-scheduled, cheap-ish, dangerous), <b>processes</b> (isolated, safe, heavier to communicate), <b>async/await with an event loop</b> (one thread juggling many waits — excellent for I/O, ruined by a single blocking call), and <b>message passing</b> (goroutines and channels, actors — share by communicating rather than communicating by sharing).</p><p>Know your runtime’s constraint: Python’s GIL and Node’s single loop mean CPU-bound work needs separate processes or workers, not more async. And async is <b>colored</b> — one blocking call inside an async handler stalls every other connection on that loop.</p>',
   rel:['os','async','races']},
  {id:'races', term:'Race conditions, locks, and deadlock',
   plain:'When two threads touch the same thing at once, correctness depends on timing — which you do not control.',
   gist:'A race condition is any bug whose outcome depends on the interleaving of concurrent operations. The classic is read-modify-write: two threads read the same counter, both add one, one increment vanishes. Locks fix it by making a section exclusive, at the cost of contention, and of new failure modes like deadlock.',
   why:'Race bugs are non-deterministic: they pass code review, pass tests, pass staging, and appear under production load. Reasoning about them structurally is the only defense, because you cannot reliably reproduce them.',
   deeper:'<p>The four conditions for <b>deadlock</b> are worth memorizing because breaking any one prevents it: mutual exclusion, hold-and-wait, no preemption, and circular wait. The everyday cure is the last one — always acquire locks in the same global order — plus timeouts so a stuck system fails loudly rather than hanging.</p><p>Prefer strategies that avoid locks entirely: <b>immutability</b> (nothing to race on), <b>confinement</b> (one owner per piece of state, others send messages), <b>atomic operations</b> and compare-and-swap, and pushing coordination into the database where transactions already solve it. And keep critical sections tiny — never do I/O while holding a lock.</p>',
   rel:['isolation','concurrency','purity']},
  {id:'async', term:'Async, event loops, and blocking',
   plain:'One thread can serve thousands of connections if it never waits on anything.',
   gist:'An event loop keeps a queue of ready work: start an I/O operation, register a callback, move on to other work, and resume when the OS says the data arrived. This is why a single Node or Python-async process handles enormous connection counts — none of them are consuming a thread while idle. The entire model collapses if any handler blocks.',
   why:'Blocking the loop is the defining bug of async code: one synchronous file read, one CPU-heavy loop, one accidental sync call, and every concurrent request on that process stalls together.',
   deeper:'<p>Practical rules: never call a blocking API from async code — use the async variant or push it to a worker pool; put CPU-bound work in a separate process; and be careful with unbounded concurrency — firing ten thousand simultaneous requests at a dependency is a self-inflicted denial of service, so bound it with a semaphore.</p><p>Async also complicates errors and observability: stack traces lose their context, an unawaited promise can swallow an exception silently, and cancellation must be explicit. Learn how your runtime reports unhandled rejections before you need it at 3am.</p>',
   rel:['concurrency','io','failure']},
  {id:'messaging', term:'Queues, events, and backpressure',
   plain:'Hand work to a queue instead of doing it inline — and decide what happens when the queue grows.',
   gist:'A message queue decouples producer from consumer in time: the web request enqueues and returns immediately; a worker processes later. This smooths spikes, isolates failure, and enables independent scaling. It also introduces asynchrony into your correctness model — the work is not done when the user is told it started.',
   why:'Queues are the standard cure for slow, spiky, or failure-prone work. They are also where “eventually” quietly becomes “never” if nobody watches the depth and the dead-letter queue.',
   deeper:'<p>Semantics to get right: delivery is <b>at-least-once</b> in practice, so consumers must be idempotent; ordering is only guaranteed within a partition or key, if at all; and every queue needs a <b>dead-letter queue</b> for messages that fail repeatedly, plus an alarm on it — otherwise poison messages either block the queue or vanish.</p><p><b>Backpressure</b> is the part people skip: when consumers cannot keep up, something must slow the producers down. Unbounded queues convert overload into unbounded latency and eventual collapse; bounded queues that reject or shed load fail visibly and recover. Monitor queue <em>depth</em> and <em>age of the oldest message</em>, not just throughput.</p>',
   rel:['queues','idempotency','observability']},
  {id:'failure', term:'Designing for failure',
   plain:'Every remote call will fail eventually. The design question is what happens when it does.',
   gist:'Distributed systems are failure-normal: dependencies time out, return errors, or — worst of all — get slow. Robust systems assume this and answer it explicitly with timeouts, bounded retries with backoff and jitter, circuit breakers, fallbacks, and graceful degradation. Systems that assume success cascade one dependency’s bad day into a total outage.',
   why:'Availability is determined far more by failure handling than by uptime of individual parts. Ten services at 99.9% chained naively give you 99%; handled well, the whole can be more available than any part.',
   deeper:'<p>The toolkit, and the trap in each. <b>Timeouts</b> on every call — an unbounded wait is how thread pools die. <b>Retries</b> only for transient errors, only for idempotent operations, with exponential backoff <em>and jitter</em> — synchronized retries are how a blip becomes a stampede. <b>Circuit breakers</b> stop hammering a dependency that is clearly down and let it recover. <b>Bulkheads</b> keep one dependency’s pool from starving the others.</p><p>Two further ideas: <b>fail fast beats hanging</b> (a quick error is a better user experience and a much better system behavior than a 60-second spinner), and <b>degrade gracefully</b> — serve stale data or hide a non-essential panel rather than returning a 500 for the whole page.</p>',
   rel:['idempotency','distributed','observability']},
  {id:'distributed', term:'What distribution really costs',
   plain:'Crossing a process boundary turns a function call into an unreliable, slow, partial-failure event.',
   gist:'The fallacies of distributed computing are a list of things everyone assumes and none of which are true: the network is reliable, latency is zero, bandwidth is infinite, the network is secure, topology does not change, there is one administrator, transport cost is zero, the network is homogeneous. Every one of them is a production incident waiting for a deadline.',
   why:'Distribution buys independent scaling and independent deployment, and charges you in latency, partial failure, debugging difficulty, and data consistency. It is a bill many teams sign without reading.',
   deeper:'<p><b>Partial failure</b> is the qualitative change: in one process, either the call happened or it did not. Across a network, it may have happened while the response was lost — an ambiguity no amount of error handling removes, only idempotency makes survivable.</p><p>Practical consequences: you cannot have a transaction across services (hence sagas and outboxes); you cannot trust a clock to order events across machines (hence logical clocks and version vectors); and “is it down or just slow?” is genuinely undecidable, which is why every distributed system ultimately relies on timeouts and heartbeats rather than certainty.</p>',
   rel:['consistency','failure','monolith']},
  {id:'observability', term:'Logs, metrics, and traces',
   plain:'If you cannot see what a system is doing, you are not operating it — you are hoping.',
   gist:'Three complementary signals. Logs are discrete events with context — what happened, to whom, with what identifiers. Metrics are numeric aggregates over time — rates, errors, durations, saturation — and are what alerts are built on. Traces follow one request across every service it touches, showing where the time actually went.',
   why:'Debugging distributed behavior by reading source code does not work. Observability is what converts “users say it’s slow” into “the third call in this trace takes 900 ms at p99”.',
   deeper:'<p>Practices that pay for themselves: <b>structured logging</b> (JSON with fields, not sentences you will later regret regexing), a <b>correlation/trace ID</b> propagated through every call and logged everywhere, and the <b>RED</b> metrics for each service — Rate, Errors, Duration — plus saturation for each resource.</p><p>Two disciplines that separate mature teams: <b>alert on symptoms users feel</b> (error rate, latency, queue age) rather than causes (CPU at 80% is not an outage), and remember that <b>logging is not free</b> — a debug log in a hot loop can cost more than the work itself, and logging secrets or personal data is a breach that persists in your log store for the retention period.</p>',
   rel:['measure','failure','debugging']},
  {id:'monolith', term:'Monolith, services, and the cost of a boundary',
   plain:'Services are an organizational tool with a technical price. Pay it deliberately.',
   gist:'A modular monolith is one deployable with clear internal boundaries: simple to run, easy to change atomically, fast in-process calls. Services split along those boundaries buy independent deploys, independent scaling, and team autonomy — and charge you network latency, partial failure, distributed data, and an operations burden that grows with the count.',
   why:'The most common expensive architecture mistake of the last decade was distributing a system that was never modular in the first place — converting method calls into network calls without ever fixing the coupling underneath.',
   deeper:'<p><b>Conway’s Law</b> explains most real service boundaries: systems mirror the communication structure of the organizations that build them. If two services are always deployed together by the same team, they are one service with extra latency; if one team owns twelve services, they own twelve deploy pipelines and on-call surfaces.</p><p>The advice that has aged best: start with a well-structured monolith, enforce module boundaries in code, and extract a service only when there is a concrete reason — different scaling profile, different release cadence, a genuinely separate team, or an isolation requirement. Extraction is far easier from a modular monolith than from a distributed ball of mud.</p>',
   rel:['layering','distributed','tradeoffs']},
],
  ex:[
  {id:'x-request', title:'Follow one request all the way down', time:'45 min', level:'Hands-on',
   plain:'Take a single URL apart into DNS, TCP, TLS, and HTTP — with timings for each stage.',
   steps:'<li>Run <code>dig example.com</code> and note the resolution and the TTL. Then <code>curl -v https://example.com</code> and identify the connection, the TLS handshake, and the request headers in the output.</li><li>Get per-stage numbers: <code>curl -w "dns:%{time_namelookup} connect:%{time_connect} tls:%{time_appconnect} ttfb:%{time_starttransfer} total:%{time_total}\\n" -o /dev/null -s https://example.com</code></li><li>Run it again immediately and see which stages got cheaper (DNS cache, session resumption). Now run it against a server on another continent and compare.</li><li>Finally, add <code>--http1.1</code> and compare against the default. Write down where the time actually goes — it is rarely where people assume.</li>',
   rel:['network','io','measure']},
  {id:'x-race', title:'Write a race condition, then close it', time:'45 min', level:'Keystone',
   plain:'Lose increments in memory, watch the bug vanish under a debugger, then fix it properly.',
   steps:'<li>Spawn ten threads that each increment a shared counter 100,000 times with no synchronization. Print the total. Run it five times and note that it is wrong and differently wrong each time.</li><li>Add a print or a sleep inside the loop and watch the bug become much harder to reproduce — the reason race bugs survive debugging sessions.</li><li>Fix it three ways: a mutex, an atomic increment, and confinement (each thread counts locally, one merge at the end). Time all three under contention.</li><li>Bonus: create a deadlock with two locks acquired in opposite orders by two threads, then fix it with a consistent global lock ordering.</li>',
   hint:'<p>If your language has a race detector (Go’s <code>-race</code>, ThreadSanitizer, Java’s jcstress), run the broken version under it. Watching a tool point straight at the unsynchronized access is worth an hour of reading.</p>',
   rel:['races','concurrency','os']},
  {id:'x-retry', title:'Cause a retry storm, then survive one', time:'50 min', level:'Keystone',
   plain:'Build the cascade that takes real systems down, then add the three controls that stop it.',
   steps:'<li>Run a toy service A that calls service B. Make B slow (2s) and give A no timeout. Load A with 50 concurrent clients and watch A’s pool exhaust — A is now down because B is slow, not broken.</li><li>Add a 500 ms timeout in A plus three immediate retries. Observe B’s load <em>triple</em> exactly when it was already struggling. That is the storm.</li><li>Add exponential backoff with jitter. Then add a circuit breaker that opens after N consecutive failures and half-opens to probe.</li><li>Finally add a fallback (cached or degraded response) and confirm A now stays up and useful while B is entirely down. Write down the four controls — they are the same four in every resilient system.</li>',
   rel:['failure','distributed','messaging']},
  {id:'x-trace', title:'Instrument a request end to end', time:'50 min', level:'Hands-on',
   plain:'Generate a trace ID, thread it through two services, and find where the latency lives.',
   steps:'<li>Generate a trace ID at the entry point of service A, pass it in a header to service B, and include it in every log line in both.</li><li>Switch both services to structured JSON logs with fields: trace ID, route, duration, status.</li><li>Add timing around each external call and log it. Fire 100 requests with a deliberate slow dependency and compute p50, p95, and p99 from your own logs — not the mean.</li><li>Now answer, using only the logs: which call dominates p99, and is it the same call that dominates p50? The answer is usually no, and that gap is why tail latency needs its own attention.</li>',
   rel:['observability','amortized','measure']},
]},
{
  numeral:'VI', slug:'correctness', title:'Correctness & Change',
  desc:'Code is read and modified far more than it is written. This chapter is about keeping a system true while it moves — and about the safety net that lets you move fast without breaking things.',
  topics:[
  {id:'testing', term:'What tests are actually for',
   plain:'Not proving correctness — buying the confidence to change things.',
   gist:'A test suite’s real product is courage. It lets you refactor, upgrade, delete, and accept unfamiliar code without a knot in your stomach, because a machine will tell you within a minute whether you broke something. Bug-catching is a side effect; the primary value is that change stops being frightening.',
   why:'When large volumes of code can be produced quickly, the constraint moves to verification. Tests are the mechanism by which you can accept code you did not write line by line — they encode what must remain true regardless of who or what wrote it.',
   deeper:'<p>A test is worth writing when it is <b>fast</b>, <b>deterministic</b>, and <b>fails for exactly one reason</b>. Flaky tests are worse than no tests: they train the team to ignore red, which destroys the signal for everything else. Delete or fix them the day they appear.</p><p>Coverage is a weak proxy — it measures lines executed, not properties verified, and 100% coverage with no assertions is possible. Better questions: if I broke this rule, would a test fail? Can I name the behavior each test protects? A useful discipline is <b>mutation testing</b>, which changes your code deliberately and checks that a test notices.</p>',
   rel:['pyramid','property','refactoring']},
  {id:'pyramid', term:'The testing pyramid',
   plain:'Many fast unit tests, fewer integration tests, a handful of end-to-end tests.',
   gist:'Unit tests check one piece in isolation: milliseconds, precise failures, but they can all pass while the assembled system is broken. End-to-end tests exercise the real thing through the real interface: maximum confidence, but slow, flaky, and vague about what failed. Integration tests sit between, checking that two real components agree.',
   why:'The shape matters because feedback speed determines how often you run it. A suite that takes forty minutes is a suite people skip, and a skipped suite provides zero protection regardless of how thorough it is.',
   deeper:'<p>Rough targets: unit tests in milliseconds and run on save; integration tests in seconds against a real database in a container (not a mock — the value is checking your assumptions about the real thing); a small number of end-to-end tests covering only critical user journeys, run in CI.</p><p>The complementary idea is the <b>testing trophy</b>, which argues for weighting integration tests most heavily, because that is where realistic bugs live in web applications. Both models agree on the point that matters: put your tests where the risk is, not uniformly, and never let the slow layer become the thick one.</p>',
   rel:['testing','mocks','cicd']},
  {id:'mocks', term:'Test doubles and the mocking trap',
   plain:'Fake collaborators make tests fast and isolated — and can make them prove nothing.',
   gist:'A stub returns canned data; a mock asserts that an interaction happened; a fake is a working lightweight implementation. All three replace something real. The trap is mocking so heavily that your test verifies your assumptions about a dependency instead of the dependency’s behavior — passing perfectly while production breaks.',
   why:'Over-mocked tests are the classic reason a suite is green during an outage. They also cement implementation details, so every refactor breaks tests even when behavior is unchanged.',
   deeper:'<p>Guidance that holds up: mock at <b>architectural boundaries</b> you own (a <code>PaymentGateway</code> interface), not at arbitrary internal seams. Prefer <b>fakes over mocks</b> — an in-memory repository is more honest and less brittle than five <code>expect(...).toHaveBeenCalledWith(...)</code> assertions. And test <b>behavior, not calls</b>: asserting that a method was invoked is asserting your implementation, not your requirement.</p><p>For third parties, the strongest technique is <b>contract testing</b>: record real responses and replay them, and periodically verify the recording still matches reality. That catches the failure mocks are blind to — the provider changed.</p>',
   rel:['pyramid','contracts','purity']},
  {id:'property', term:'Property-based testing and fuzzing',
   plain:'Instead of examples you thought of, state a rule and let a machine attack it.',
   gist:'Example tests check the cases you imagined — and bugs live in the cases you did not. Property testing states an invariant (“encoding then decoding returns the original”, “the result is always sorted”, “the total never goes negative”) and generates hundreds of inputs trying to break it, then shrinks any failure to a minimal counterexample.',
   why:'Properties are specifications, and specifications are exactly the artifact that stays valuable when implementations are cheap. One good property can outperform fifty hand-written examples.',
   deeper:'<p>Properties that transfer to almost any codebase: <b>round-trip</b> (parse ∘ serialize = identity), <b>invariance</b> (output always satisfies a constraint), <b>idempotence</b> (applying twice equals once), <b>oracle</b> (matches a slow obviously-correct implementation), and <b>metamorphic</b> (adding an element never decreases the count).</p><p><b>Fuzzing</b> is the security-flavored cousin: throw malformed and hostile input at a parser or endpoint and look for crashes, hangs, and memory errors. Both techniques share the mindset that matters most in review — stop asking “does it work?” and start asking “what input would break this?”</p>',
   rel:['invariants','testing','security']},
  {id:'static', term:'Types, linters, and cheap proofs',
   plain:'Every bug a tool can catch is a bug no human has to.',
   gist:'Static analysis inspects code without running it. A type checker proves whole categories of errors impossible; a linter catches known-bad patterns; a formatter ends style arguments permanently; a dependency scanner flags known vulnerabilities. All of them are feedback that arrives in seconds, applies to every line, and never gets tired.',
   why:'Automated checks scale to any volume of code and any author. If review capacity is the bottleneck, everything a machine can verify should be verified by a machine before a human ever looks.',
   deeper:'<p>Configure them to be <b>enforced, not advisory</b>: run in CI, fail the build, and format automatically on commit. A warning nobody must fix is a warning nobody fixes. Set the strictness high in new code (strict null checks, no implicit <code>any</code>) even if legacy areas are exempted by path.</p><p>Beyond types, cheap wins include null-safety analysis, exhaustiveness checking on unions (so adding a case forces every switch to be updated — one of the great underrated features of sum types), dead-code detection, and secret scanning in the commit hook. Each removes a category of review comment forever.</p>',
   rel:['types','cicd','review']},
  {id:'debugging', term:'Debugging as a discipline',
   plain:'Not guessing and changing things — forming a hypothesis and running an experiment.',
   gist:'Effective debugging is the scientific method under deadline: reproduce reliably, observe what actually happens, form a hypothesis that explains all of the evidence, design the smallest experiment that could refute it, and repeat. The frequent failure is skipping straight to changing code, which sometimes hides the symptom and never explains it.',
   why:'It is the skill that transfers completely across languages, stacks, and eras — and the one you need most when reading unfamiliar code, because you cannot rely on remembering what it was supposed to do.',
   deeper:'<p>Techniques worth having ready: <b>reduce to a minimal reproduction</b> (deleting half the input repeatedly is astonishingly effective); <b>bisect</b> in time with <code>git bisect</code> to find the introducing commit in log₂ n steps; <b>bisect in space</b> by disabling half the system; <b>read the error message completely</b> — the full stack trace, the caused-by chain, the line number; and <b>question your assumptions in order</b>, starting with the one you are most sure of, because that is where the bug is.</p><p>Finish properly: once found, ask why the tests did not catch it, and add the test that would have. A bug that recurs is a process failure, not bad luck.</p>',
   rel:['callstack','observability','testing']},
  {id:'refactoring', term:'Refactoring',
   plain:'Changing the structure without changing the behavior — in small, verified steps.',
   gist:'Refactoring is a specific discipline, not a synonym for rewriting: behavior stays identical and the tests stay green throughout, while the design improves. The value is that it can be done continuously, in minutes, as part of normal work — which is the only way a codebase stays habitable over years.',
   why:'Structure is exactly what accumulates value or debt over time. And when large chunks of code arrive quickly, restructuring them into something coherent becomes a primary activity rather than an occasional cleanup.',
   deeper:'<p>The rule is <b>never refactor and change behavior in the same commit</b>. Mixed commits are unreviewable and cannot be reverted cleanly. Make the change easy (refactor), then make the easy change (feature) — two commits, in that order.</p><p>High-value moves, mostly mechanical: extract a function or a variable to name a concept, inline something that hides nothing, replace conditionals with polymorphism or a lookup table, introduce a parameter object for arguments that always travel together, and split a class along the lines of which fields each method actually touches. If your editor can do it automatically, it is safe; if not, lean on tests.</p>',
   rel:['debt','testing','decomposition']},
  {id:'vcs', term:'Version control as a thinking tool',
   plain:'Git is not a backup. It is a queryable history of why the code is the way it is.',
   gist:'A well-kept history answers questions nothing else can: when did this behavior change, what else changed with it, what was the reasoning, and which commit introduced the bug. That value comes entirely from discipline — small commits that do one thing, messages that explain why rather than what, and branches that live for days rather than months.',
   why:'History is the only durable record of intent. In a codebase where much of the text was generated, the commit message explaining <em>why</em> is often the sole surviving human context.',
   deeper:'<p>Tools that repay learning properly: <code>git bisect</code> (binary search for the introducing commit — heroic on a long history), <code>git log -S"someString"</code> (find the commit that added or removed a string), <code>git blame</code> followed by reading that commit’s full message and diff, and <code>git revert</code> for undoing safely in shared history.</p><p>On workflow: long-lived branches are a merge tax that compounds daily; small, frequent, integrated changes are cheaper and safer, which is the actual argument behind trunk-based development and behind feature flags as a substitute for branching.</p>',
   rel:['debugging','cicd','review']},
  {id:'cicd', term:'CI/CD and safe deployment',
   plain:'Automate the path from commit to production, then make failing safe rather than rare.',
   gist:'Continuous integration means every change is merged and verified frequently — build, tests, linters, security scan — so integration problems appear in minutes instead of at the end of a quarter. Continuous delivery means the path to production is automated and boring. Together they shift the goal from “never break” to “detect and recover in minutes”.',
   why:'Deployment risk is a design property, not a matter of care. Teams that deploy ten times a day are not braver — they made each deploy small, observable, and reversible.',
   deeper:'<p>The safety mechanisms, in order of usefulness: <b>reversibility</b> (a rollback that takes one command and no thought), <b>gradual exposure</b> (canary to 1% of traffic, watch the metrics, then proceed), <b>feature flags</b> (decouple deploy from release, so shipping code and enabling behavior are separate decisions), and <b>automated verification</b> after deploy — smoke tests plus alerting on error rate and latency.</p><p>Two rules that prevent most bad nights: deploys must be <b>backward compatible</b> with the previous version (see expand/contract migrations), and the <b>same artifact</b> is promoted through environments — never rebuilt per environment, or you are testing something other than what you ship.</p>',
   rel:['migrations','stateless','observability']},
  {id:'debt', term:'Technical debt',
   plain:'A deliberate loan against future speed. The trouble starts when nobody records the borrowing.',
   gist:'The metaphor is precise and often misused: debt is a conscious decision to ship something imperfect now and pay interest — slower changes, more bugs — until it is repaid. Code that is simply bad was never a loan; it is a mess. The distinction matters because deliberate debt can be tracked, budgeted, and repaid, while a mess just spreads.',
   why:'Interest compounds fastest in structure and data — a bad schema or a wrong boundary taxes every subsequent change, including the ones written for you in seconds.',
   deeper:'<p>A useful taxonomy: <b>deliberate and prudent</b> (“ship the manual process, automate after launch” — fine, write it down), <b>deliberate and reckless</b> (“no time for design”), <b>accidental and prudent</b> (“now we understand the domain better” — this is normal and healthy), and <b>accidental and reckless</b> (nobody knew better).</p><p>Repayment works best <b>opportunistically</b>: improve the area you are already working in, in the commit before your feature. Large dedicated cleanup projects rarely get funded, rarely finish, and touch code nobody was going to change anyway. And prioritize by <b>rate of change</b> — messy code that nobody edits costs nothing.</p>',
   rel:['refactoring','tradeoffs','change']},
  {id:'security', term:'Security by construction',
   plain:'Assume every input is hostile and every component will eventually be reachable by someone who is.',
   gist:'Most breaches are not exotic. They are injection through unvalidated input, broken authentication or authorization, secrets committed to a repository, unpatched dependencies, and data exposed by a misconfigured default. The defenses are structural: validate at the boundary, use parameterized queries, check authorization on every request at the server, and keep secrets out of code.',
   why:'Security is the area where plausible-looking code is most dangerous, because vulnerable code runs correctly on every input except the malicious one — and no test you would think to write covers it.',
   deeper:'<p>The load-bearing principles: <b>never build queries or commands by string concatenation</b> — parameterize, always; <b>authenticate and authorize on the server for every request</b> (a hidden UI button is not access control, and an object ID in a URL must be checked against the caller); <b>least privilege</b> for every credential, service, and token; <b>encrypt in transit and at rest</b>; and <b>never invent your own crypto or session handling</b> — use the vetted library.</p><p>Process matters as much: keep dependencies patched (most real incidents involve a known CVE), scan for committed secrets, rotate credentials, log security-relevant events, and log nothing sensitive. Then read the OWASP Top Ten once a year — it is short and it is where the attacks actually are.</p>',
   rel:['property','review','contracts']},
  {id:'review', term:'Code review',
   plain:'The main channel for spreading understanding — and the last gate before something becomes everyone’s problem.',
   gist:'Review catches defects, but its larger effects are shared context, consistent design, and mentoring in both directions. Good review focuses on what tools cannot check: is this the right approach, is the boundary sound, are the failure modes handled, will the next person understand it? Formatting and style should already have been settled by machines.',
   why:'The volume of code needing review is rising while the number of people able to review it is not. Reviewing for design and risk rather than syntax is the only version of this that scales.',
   deeper:'<p>Practices supported by the research: keep changes <b>small</b> (defect detection collapses beyond a few hundred lines), review <b>promptly</b> (a stale branch costs more than a fast review), and <b>ask questions rather than issue verdicts</b> — “what happens if this list is empty?” teaches; “this is wrong” does not.</p><p>A reviewer’s checklist worth internalizing: what are the failure modes, what happens under concurrency, what happens on the empty and the enormous input, is this boundary in the right place, what is not tested, and could this have been simpler? That list is also exactly the right lens for reviewing code you did not write by hand.</p>',
   rel:['llmreview','security','simplicity']},
],
  ex:[
  {id:'x-bisect', title:'Find a bug you planted twenty commits ago', time:'40 min', level:'Hands-on',
   plain:'Learn git bisect on a bug you already know the answer to, so you can use it when you don’t.',
   steps:'<li>In a scratch repo, make 25 small commits. Somewhere in the middle, introduce a subtle bug — an off-by-one, or a flipped comparison.</li><li>Write a one-line test script that exits 0 when the code is good and 1 when broken.</li><li>Run <code>git bisect start</code>, mark the ends, and then <code>git bisect run ./test.sh</code>. Watch it find the exact commit in about five steps.</li><li>Now try <code>git log -S</code> on the changed string, and <code>git blame</code> on the line. Three tools, three angles — all far faster than reading.</li>',
   rel:['vcs','debugging','testing']},
  {id:'x-property', title:'Let a property test surprise you', time:'45 min', level:'Keystone',
   plain:'State an invariant about code you trust, and watch a generator find the input you never considered.',
   steps:'<li>Install a property-testing library (Hypothesis, fast-check, jqwik, proptest — every ecosystem has one).</li><li>Pick a function you believe is correct: a parser, a date range calculation, a price or discount rule, a string sanitizer.</li><li>Write one property, not examples — round-trip, or “output always satisfies X”, or “matches this obviously-correct slow version”. Run a thousand cases.</li><li>When it fails — and it usually does — note that the framework shrinks the input to a minimal counterexample. Add that case as a permanent example test, fix the bug, and keep the property.</li>',
   hint:'<p>Empty strings, unicode, leap days, daylight-saving transitions, negative zero and the maximum integer are where the bodies are buried. A generator finds these in seconds; a human writing test cases essentially never does.</p>',
   rel:['property','invariants','testing']},
  {id:'x-characterize', title:'Add a test to code that has none', time:'50 min', level:'Keystone',
   plain:'The legacy-code manoeuvre: pin current behavior first, then change it safely.',
   steps:'<li>Find a gnarly function with no tests and dependencies baked in — file access, a clock, a network call, a global.</li><li>Do not fix it yet. Write <b>characterization tests</b> that assert whatever it currently does, including behavior you think is wrong. You are pinning reality, not correctness.</li><li>Introduce one seam: pass the clock or the repository in as a parameter, or extract the pure decision logic out of the I/O. Keep the tests green.</li><li>Now change the behavior you believe is wrong, and watch exactly one test fail. Update it deliberately. That is the whole loop for working in code you do not trust.</li>',
   rel:['refactoring','mocks','purity']},
  {id:'x-injection', title:'Exploit your own endpoint', time:'50 min', level:'Hands-on',
   plain:'Write the vulnerability, exploit it locally, then close it — the lesson does not stick from reading.',
   steps:'<li>Build a tiny local app with a login form whose SQL is assembled by string concatenation. Log in as admin with <code>\' OR \'1\'=\'1</code> and confirm you are through.</li><li>Fix it with a parameterized query. Try the same input and watch it become an ordinary failed login.</li><li>Repeat for two more classes: render unescaped user input into HTML and pop an alert (XSS), then add an endpoint that fetches a record by ID without checking ownership and read someone else’s data (IDOR — the most common real-world API flaw).</li><li>Finally, run a dependency audit (<code>npm audit</code>, <code>pip-audit</code>, <code>govulncheck</code>) on a real project of yours and read what comes back.</li>',
   hint:'<p>Do this only against something you built, running locally. The point is calibration: these take one line to introduce, one line to prevent, and are trivially found by anyone scanning the internet.</p>',
   rel:['security','property','review']},
]},
{
  numeral:'VII', slug:'judgment', title:'Judgment',
  desc:'The senior skill: choosing well, justifying the choice, and living with it. This is where the previous six chapters convert into leverage — and where the work is heading.',
  topics:[
  {id:'requirements', term:'Solving the right problem',
   plain:'The most expensive defect is a perfectly built thing nobody needed.',
   gist:'Requests arrive as solutions (“add a CSV export”) and hide the actual need (“I reconcile these numbers every Monday and it takes two hours”). The job is to work backwards to the need, because the need usually admits several answers, and the one the requester named is rarely the cheapest or the best.',
   why:'Implementation speed increases the cost of building the wrong thing, because you now build it faster and in greater quantity. Problem selection is the highest-leverage decision in the whole process.',
   deeper:'<p>Questions that consistently earn their time: <b>who</b> is this for and what do they do today instead? <b>How often</b> does this happen, and what does it cost when it goes wrong? <b>What does done look like</b> — how would we know it worked? <b>What is explicitly out of scope?</b> And the one that saves the most effort: <b>what happens if we do nothing?</b></p><p>Specify the edges as carefully as the happy path. Most disputes about “it does not work” are disputes about the unstated case: empty results, duplicates, permissions, partial failure, what the user sees while it is loading. Write those down before writing code — they are the specification, and everyone including a model will implement what you actually specified.</p>',
   rel:['spec','tradeoffs','estimation']},
  {id:'tradeoffs', term:'Trade-offs and the absence of “best”',
   plain:'Every choice buys something with something else. Seniority is naming the currency.',
   gist:'There is no best database, language, or architecture — only fits for a set of constraints. Speed against flexibility, consistency against availability, simplicity against capability, build against buy, now against later. The mark of experience is not knowing the right answer but stating precisely what each option costs and under what conditions it wins.',
   why:'A model will give you a confident recommendation for any question you ask. Knowing which constraints actually apply to your situation — team size, load, deadline, existing systems, who maintains it — is what makes a recommendation usable or dangerous.',
   deeper:'<p>A practical format for any real decision: list the options (including doing nothing), state the two or three criteria that actually matter <em>here</em>, note what each option costs and what it makes hard later, and record the conditions under which you would revisit. That last field is what separates a decision from an opinion.</p><p>Watch for the standard distortions: <b>novelty bias</b> (choosing what is interesting to build), <b>résumé-driven development</b>, <b>sunk cost</b> (defending a choice because of its price rather than its future), and <b>optimizing for a scale you do not have</b> — the most expensive of all, because it charges you complexity every day for a problem that may never arrive.</p>',
   rel:['adr','change','simplicity']},
  {id:'measure', term:'Measure, don’t guess',
   plain:'Programmer intuition about performance is famously, reliably wrong.',
   gist:'Optimization without measurement is superstition. Profile first, find where the time or memory actually goes, fix the largest contributor, and measure again. The bottleneck is nearly always somewhere nobody predicted — an accidental query in a loop, a serialization step, a lock, a cold cache — and the code people “know” is slow is usually irrelevant.',
   why:'Confident, plausible performance advice is abundant and cheap. Evidence about your system under your load is scarce and decisive.',
   deeper:'<p><b>Amdahl’s Law</b> bounds the payoff: if a part takes 5% of total time, making it infinitely fast buys you 5%. So always find the dominant term before touching anything.</p><p>Benchmarking honestly is harder than it looks: warm up (JIT, caches, connection pools), use realistic data sizes and distributions, measure percentiles rather than means, run enough iterations to see variance, and change one thing at a time. And measure in the environment that matters — laptop numbers rarely predict production, where contention, cold caches, and network latency dominate.</p>',
   rel:['io','amortized','observability']},
  {id:'estimation', term:'Estimation and scope',
   plain:'You cannot predict duration well. You can decompose, sequence, and communicate uncertainty.',
   gist:'Estimates are wrong because software work involves discovery — you learn what the task really is by doing it. The useful skills are breaking work into pieces small enough to reason about (a piece you cannot estimate is a piece you do not understand yet), identifying the unknowns early, and giving ranges with the assumptions attached rather than a false single number.',
   why:'Faster implementation does not shrink the unpredictable parts — integration, edge cases, review, migration, and the discovery of what was actually wanted. Those are now a larger share of the work, not a smaller one.',
   deeper:'<p>Techniques that genuinely help: <b>decompose until each piece is under a day</b>; <b>timebox a spike</b> to answer the riskiest unknown before estimating the rest; use <b>reference-class forecasting</b> (how long did the last three similar things take, including the parts you forgot?); and quote a <b>range</b> with the assumption that changes it.</p><p>Two chronic biases: the <b>planning fallacy</b> (we estimate the happy path and omit review, deploy, docs, and rework), and forgetting that estimates are not commitments. The most valuable communication is not the number — it is the early warning when the assumptions behind it stop holding.</p>',
   rel:['requirements','tradeoffs','durable']},
  {id:'reading', term:'Reading code',
   plain:'The dominant activity of the job, and the one almost nobody practises deliberately.',
   gist:'Engineers read far more code than they write, and the ratio is climbing. Reading well is a technique, not osmosis: start from an entry point and follow one path, ignore everything not on it, use the debugger and the tests as documentation, sketch the data flow, and take notes. Attempting to understand everything at once is how people bounce off large codebases.',
   why:'When code arrives faster than any person can write it, comprehension becomes the bottleneck. The ability to read an unfamiliar system quickly and judge whether it is sound is now the core competency.',
   deeper:'<p>Approaches that work on a large unfamiliar codebase: <b>follow one request end to end</b> with a debugger and breakpoints; <b>read the tests first</b> — they state intended behavior more honestly than comments; <b>read the data model</b>, which constrains everything else; <b>use the history</b> (<code>git log</code> on a file tells you what kept changing and why); and <b>change something small</b> and see what breaks — the fastest way to map the real dependencies.</p><p>Reading is also a design education: every codebase you read teaches you a pattern to reuse or to avoid, and it is one of the few ways to build taste without waiting for years of your own mistakes.</p>',
   rel:['debugging','llmreview','naming']},
  {id:'adr', term:'Architecture decision records',
   plain:'A short written record of what you chose, what you rejected, and why.',
   gist:'An ADR is one page per significant decision: the context and constraints at the time, the options considered, the choice, and the consequences accepted. It takes twenty minutes to write and answers, years later, the question that otherwise costs days — “why on earth is it like this?”',
   why:'Rationale is the context that no amount of code reading recovers, and the artifact that keeps a system understandable as the people and the code around it both turn over.',
   deeper:'<p>Keep them in the repository next to the code, numbered and immutable: when a decision changes, write a new ADR that supersedes the old one rather than editing history. The rejected options are frequently the most valuable section — they stop the team from relitigating the same debate every eighteen months.</p><p>Reserve them for decisions that are expensive to reverse: data model, service boundaries, a core vendor, an auth model, a language or runtime. Do not write one for a library choice inside a single module. A good test: would a new senior engineer be tempted to change this without knowing what we knew?</p>',
   rel:['tradeoffs','change','spec']},
  {id:'llmreview', term:'Reviewing machine-written code',
   plain:'It compiles, it reads well, the tests pass, and it may still be wrong in a way you must catch.',
   gist:'Generated code has a distinctive risk profile: fluent, idiomatic, confident, and occasionally subtly wrong. It tends to handle the happy path, invent plausible APIs, ignore concurrency and failure modes, and reproduce the average of its training data — which is not the same as the right answer for your system. Fluency is not evidence of correctness.',
   why:'This is the concrete skill the rest of the guide exists to support. Every concept in chapters I to VI is a lens for reviewing code whose author cannot explain their reasoning to you.',
   deeper:'<p>A working checklist, drawn from the earlier chapters. <b>Contract</b>: does it match the interface you specified, including errors and edge cases? <b>Boundaries</b>: is validation at the edge and are invariants enforced where they cannot be bypassed? <b>Concurrency</b>: does it read-modify-write, share mutable state, or assume a call happens once? <b>Failure</b>: are there timeouts, are retries safe, what happens if the dependency is slow rather than down? <b>Data</b>: does it fire a query per iteration, does it match the schema, is the migration reversible? <b>Security</b>: string-concatenated queries, missing authorization, secrets, unescaped output. <b>Fit</b>: does it duplicate something that exists, and does it belong in this module at all?</p><p>The habit that matters most: <b>require a reason, not an output</b>. If you cannot explain why the code is correct, you cannot own it — and you will own it, because your name is on the commit.</p>',
   rel:['review','contracts','security']},
  {id:'spec', term:'Specification as the durable artifact',
   plain:'When implementations are cheap, the precise statement of intent becomes the valuable thing.',
   gist:'The scarce asset shifts from code to unambiguous intent: the interface, the invariants, the properties, the tests, the acceptance criteria, the decision records. These are what determine whether an implementation — by anyone or anything — is correct, and they survive rewrites, refactors, language changes, and model upgrades.',
   why:'This is the strategic argument of the whole guide. Foundations are what let you write specifications precise enough to be checkable, and architecture is what makes an implementation swappable behind them.',
   deeper:'<p>In practice, a good specification is layered: <b>types</b> that make illegal states unrepresentable, <b>contracts</b> stating pre- and postconditions, <b>properties</b> a machine can attack with generated input, <b>examples</b> for the cases you care about by name, and <b>ADRs</b> for the reasoning that none of the above captures.</p><p>The workflow this suggests: specify, generate or write, then verify against the specification rather than by reading every line. The verification step is not optional — it is the part that makes the speed safe, and it is the part with your judgment in it.</p>',
   rel:['contracts','property','invariants']},
  {id:'simplicity', term:'Simplicity as a discipline',
   plain:'Simple is not the same as easy — and simple is the one that keeps paying.',
   gist:'Rich Hickey’s distinction: <em>easy</em> means familiar and near at hand; <em>simple</em> means not braided together — one concept, one responsibility, few interconnections. A framework can be easy and deeply complex; a plain function can be unfamiliar and utterly simple. Complexity is what accumulates until a system resists all change.',
   why:'Complexity is now trivially cheap to add and as expensive as ever to remove. The pressure runs entirely in one direction, so deliberate restraint is the counterweight.',
   deeper:'<p>Ousterhout’s framing is complementary: complexity is anything that makes a system hard to understand or modify, and it accumulates <b>incrementally</b> — no single change looks unreasonable, which is exactly why it wins. His counter-move is designing <b>deep modules</b>: a simple interface hiding substantial functionality, as opposed to shallow modules whose interfaces are nearly as complicated as their contents.</p><p>Practical expressions of the same idea: fewer concepts over more configurability, one obvious way over three flexible ways, deleting code as a legitimate accomplishment, and being suspicious of any abstraction whose explanation takes longer than the thing it abstracts.</p>',
   rel:['dry','change','tradeoffs']},
  {id:'secondorder', term:'Second-order effects',
   plain:'Ask what happens next — and what happens after that.',
   gist:'Every technical decision has consequences beyond its intent. Add a cache and you have created a consistency problem and an on-call surface. Split a service and you have created a deploy dependency and a team boundary. Add a metric and people will optimize for it. Systems thinking is the habit of asking what your change makes easy, hard, and inevitable.',
   why:'The first-order answer is the easy part and increasingly automated. The second-order consequences — on operations, on the people, on what becomes possible next — are where engineering judgment actually lives.',
   deeper:'<p>Patterns worth recognizing: <b>Conway’s Law</b> (architecture mirrors organization, so a boundary between teams becomes a boundary in the system whether you designed one or not); <b>Goodhart’s Law</b> (a measure that becomes a target stops measuring — see any team judged on ticket counts or coverage percentage); and <b>feedback loops</b>, where the slow deploy causes bigger batches which cause riskier deploys which cause more process which causes slower deploys.</p><p>Also Chesterton’s Fence: before removing something that appears pointless, find out why it is there. In old systems, the strange code is often load-bearing — an incident from before your time, encoded.</p>',
   rel:['monolith','debt','tradeoffs']},
  {id:'durable', term:'What compounds',
   plain:'Some knowledge expires in eighteen months; some has been true for fifty years. Invest accordingly.',
   gist:'Framework APIs, tool syntax, and vendor specifics decay fast and are cheap to look up. Data modelling, concurrency, distributed failure, abstraction, debugging method, and communication compound over a whole career — and each new technology is easier to learn because you already have them. This guide is a map of the second category.',
   why:'The half-life of tools keeps shortening while the half-life of fundamentals stays effectively infinite. That gap is the single best argument for how to spend your learning time.',
   deeper:'<p>What has actually compounded for practitioners over decades: understanding how machines and networks behave; modelling data and domains; reasoning about concurrency and failure; decomposing systems; debugging systematically; and writing and speaking clearly enough that other people can act on your reasoning.</p><p>The practical implication is not to ignore tools — you must be productive today — but to learn each new one by asking which old idea it is an instance of. A queue is a queue, a cache is a cache, an index is a B-tree, a hook is a callback. People with foundations learn new tools in days; people with only tools start over every cycle.</p>',
   rel:['spec','reading','simplicity']},
],
  ex:[
  {id:'x-adr', title:'Write three ADRs after the fact', time:'45 min', level:'Hands-on',
   plain:'Reconstruct decisions you already made, and discover which ones you cannot justify.',
   steps:'<li>Pick three consequential decisions in a system you work on — the database, a service boundary, an auth approach, a queue.</li><li>For each, write one page: context and constraints at the time, options considered, decision, consequences accepted, and what would make you revisit.</li><li>Note where you struggle. A decision you cannot reconstruct a rationale for is either inherited or accidental — both worth knowing about.</li><li>Commit them to the repo as <code>docs/adr/0001-*.md</code>. Then write the next one <em>before</em> the decision rather than after, and notice how the writing changes the decision.</li>',
   rel:['adr','tradeoffs','requirements']},
  {id:'x-design-hour', title:'A system design in one hour', time:'60 min', level:'Keystone',
   plain:'Design something real end to end, on paper, defending every choice with a constraint.',
   steps:'<li>Pick a concrete problem: a URL shortener, a ticket booking system, a notification service, an activity feed. Write the requirements and non-requirements first, including scale and consistency needs.</li><li>Sketch the API boundary, then the data model, then the components. Do the arithmetic: requests per second, storage per year, read/write ratio. Numbers change designs.</li><li>Now attack it. Where is the single point of failure? What happens at ten times the load? Which operation is not idempotent? Where does data become inconsistent? What is the p99 path?</li><li>Write the one page you would give to someone implementing it — and notice that this page, not the code, is the actual design work.</li>',
   hint:'<p>Do this out loud or in writing, never just in your head — the gaps only become visible when you have to state the thing precisely. Repeat monthly with a different problem; this is the single most transferable exercise in the guide.</p>',
   rel:['spec','tradeoffs','distributed']},
  {id:'x-adversarial', title:'Adversarially review generated code', time:'50 min', level:'Keystone',
   plain:'Run the chapter VII checklist against a module you did not write by hand, and count what you find.',
   steps:'<li>Have a non-trivial module generated: something with I/O, concurrency, and persistence — a job runner that polls a queue and updates records, say. Do not specify carefully; use a normal casual prompt.</li><li>Review it against the checklist in “Reviewing machine-written code”, one pass per category: contract, boundaries, concurrency, failure, data, security, fit.</li><li>Write down every issue with the concept it violates — “read-modify-write, no locking (isolation)”, “no timeout on the HTTP call (failure)”, “query inside the loop (io)”.</li><li>Now redo it: write a precise contract and the invariants first, generate again, and re-run the review. Compare the two defect counts. That difference is the value of specification, measured.</li>',
   rel:['llmreview','spec','review']},
  {id:'x-profile', title:'Find the real five percent', time:'45 min', level:'Hands-on',
   plain:'Predict the bottleneck, profile it, and be wrong — the lesson that makes you measure forever.',
   steps:'<li>Take a slow script or endpoint of your own. <em>Before</em> profiling, write down where you believe the time goes, with percentages. Seal it.</li><li>Profile it properly (a sampling profiler, or your language’s built-in). Find the top three contributors by total time, not by call count.</li><li>Compare with your prediction. Then fix only the dominant one, and re-measure — including whether the bottleneck simply moved.</li><li>Apply Amdahl: compute the maximum possible gain from the thing you were <em>about</em> to optimize. Keep that number as a permanent argument against guessing.</li>',
   rel:['measure','io','amortized']},
  {id:'x-capstone', title:'Capstone: build one small system properly', time:'multi-day', level:'Capstone',
   plain:'Everything in this guide, applied once, to something small enough to actually finish.',
   steps:'<li><b>Specify</b>: one page of requirements and non-requirements, the API contract, and the invariants that must always hold.</li><li><b>Model</b>: the data model first, with constraints in the database, not only in code. Write the ADR for the choice.</li><li><b>Build</b>: functional core with pure logic, thin imperative shell, dependencies pointing inward. Generate freely inside the boundaries you defined; review everything against the checklist.</li><li><b>Prove</b>: unit tests for the logic, integration tests against a real database, one property test per invariant, and one end-to-end test of the critical path.</li><li><b>Operate</b>: structured logs with a trace ID, RED metrics, timeouts and retries on every remote call, a health endpoint, and a rollback you have actually rehearsed.</li><li><b>Reflect</b>: load it until something breaks, then write the incident report to yourself. What broke first is what you under-designed, and that is worth more than the working system.</li>',
   hint:'<p>Keep it genuinely small — a link shortener, a webhook receiver, an expenses tracker. The value is in doing every step properly once, not in the size of the artifact. Then do it again in six months and watch which steps have become automatic.</p>',
   rel:['spec','x-design-hour','durable']},
]},
