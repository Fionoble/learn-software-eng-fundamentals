<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Working Guide to Software Engineering</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340..700;1,9..144,340..700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

:root{
  --paper:#EFEDE5;
  --paper-deep:#E4E1D6;
  --card:#FAF8F2;
  --ink:#1C2027;
  --ink-soft:#5B6472;
  --line:#D2CEC1;
  --blue:#2C5D82;
  --blue-soft:#DCE7EF;
  --rust:#B0512D;
  --rust-soft:#F2DDD2;
  --brass:#8C6D2E;
  --shadow:0 1px 2px rgba(28,32,39,.06), 0 6px 18px -8px rgba(28,32,39,.2);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#15181D;
    --paper-deep:#101317;
    --card:#1C2027;
    --ink:#E6E5DF;
    --ink-soft:#98A2AF;
    --line:#333A45;
    --blue:#84B2D0;
    --blue-soft:#1E2A34;
    --rust:#DE8560;
    --rust-soft:#33201A;
    --brass:#C6A559;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.6);
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Public Sans',-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.55;
  background-image:
    linear-gradient(rgba(44,93,130,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(44,93,130,.045) 1px, transparent 1px),
    radial-gradient(circle at 88% 8%, rgba(140,109,46,.07), transparent 42%);
  background-size:28px 28px, 28px 28px, auto;
  min-height:100vh;
}
::selection{background:var(--rust);color:var(--card)}

.layout{display:grid;grid-template-columns:300px 1fr;max-width:1200px;margin:0 auto;min-height:100vh;background:linear-gradient(var(--paper),var(--paper))}

/* ---------- sidebar ---------- */
aside{
  border-right:1px solid var(--line);
  padding:2.2rem 1.6rem 2rem;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:1.4rem;
}
.masthead h1{
  font-family:'Fraunces',Georgia,serif;
  font-weight:600;font-size:1.7rem;line-height:1.12;
  letter-spacing:-.01em;
}
.masthead h1 em{font-style:italic;color:var(--blue)}
.masthead .sub{
  margin-top:.55rem;font-size:.78rem;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.14em;font-weight:600;
}
.rule{border:none;border-top:1px solid var(--line);position:relative}
.rule::after{
  content:'◈';position:absolute;left:50%;top:-.72em;transform:translateX(-50%);
  background:var(--paper);padding:0 .6em;color:var(--brass);font-size:.85rem;
}
.searchwrap{position:relative}
.searchwrap input{
  width:100%;padding:.6rem .85rem .6rem 2.1rem;
  font:inherit;font-size:.85rem;
  background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:.55rem;outline:none;
  transition:border-color .15s;
}
.searchwrap input:focus{border-color:var(--blue)}
.searchwrap::before{
  content:'⌕';position:absolute;left:.7rem;top:50%;transform:translateY(-54%);
  color:var(--ink-soft);font-size:1.05rem;
}
.searchwrap kbd{
  position:absolute;right:.6rem;top:50%;transform:translateY(-50%);
  font-family:inherit;font-size:.62rem;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:.3rem;padding:.08rem .38rem;
  background:var(--paper);
}
nav{display:flex;flex-direction:column;gap:.15rem}
nav button{
  all:unset;cursor:pointer;display:flex;align-items:baseline;gap:.7rem;
  padding:.52rem .65rem;border-radius:.5rem;font-size:.86rem;
  transition:background .12s;
}
nav button:hover{background:var(--paper-deep)}
nav button.active{background:var(--blue-soft)}
nav button .numeral{
  font-family:'Fraunces',Georgia,serif;font-style:italic;
  color:var(--brass);width:1.9em;flex:none;font-size:.9rem;
}
nav button.active .numeral{color:var(--blue)}
nav button .t{flex:1;font-weight:500}
nav button .n{font-size:.68rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
nav button .n.done{color:var(--blue);font-weight:700}

.progressbox{margin-top:auto;font-size:.75rem;color:var(--ink-soft)}
.progressbox .label{display:flex;justify-content:space-between;margin-bottom:.4rem;letter-spacing:.05em}
.trail{height:6px;background:var(--paper-deep);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.trail i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--brass));border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.reset{all:unset;cursor:pointer;font-size:.68rem;color:var(--ink-soft);margin-top:.55rem;text-decoration:underline;text-underline-offset:2px}
.reset:hover{color:var(--rust)}
.sync{all:unset;display:block;cursor:pointer;font-size:.68rem;color:var(--ink-soft);margin-top:.55rem;text-decoration:underline;text-underline-offset:2px}
.sync:hover{color:var(--rust)}
.sync.on{color:var(--blue);text-decoration:none}
.sync.on:hover{color:var(--blue);text-decoration:underline}

/* ---------- main ---------- */
main{padding:2.6rem 3rem 5rem;min-width:0}
.chapter-head{margin-bottom:1.9rem;animation:rise .45s cubic-bezier(.22,1,.36,1) both}
.chapter-head .kicker{
  font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--rust);font-weight:700;margin-bottom:.5rem;
}
.chapter-head h2{
  font-family:'Fraunces',Georgia,serif;font-weight:550;font-size:2.5rem;
  line-height:1.05;letter-spacing:-.015em;margin-bottom:.7rem;
}
.chapter-head p{max-width:56ch;color:var(--ink-soft);font-size:.95rem}

.cards{display:flex;flex-direction:column;gap:.65rem}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:.75rem;
  box-shadow:var(--shadow);overflow:hidden;
  animation:rise .5s cubic-bezier(.22,1,.36,1) both;
}
.card:nth-child(1){animation-delay:.02s}.card:nth-child(2){animation-delay:.05s}
.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.11s}
.card:nth-child(5){animation-delay:.14s}.card:nth-child(6){animation-delay:.17s}
.card:nth-child(7){animation-delay:.2s}.card:nth-child(8){animation-delay:.23s}
.card:nth-child(9){animation-delay:.26s}.card:nth-child(10){animation-delay:.29s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card-head{
  all:unset;cursor:pointer;display:flex;align-items:baseline;gap:1rem;
  padding:1rem 1.25rem;width:100%;box-sizing:border-box;
}
.card-head:hover{background:color-mix(in srgb, var(--card) 70%, var(--paper-deep))}
.spec-id{
  font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:.8rem;
  color:var(--brass);flex:none;width:3.2em;font-variant-numeric:tabular-nums;
}
.card.learned .spec-id{color:var(--blue)}
.term{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.12rem;letter-spacing:-.005em}
.card.learned .term::after{
  content:'✓';margin-left:.5em;color:var(--blue);font-family:'Public Sans',sans-serif;
  font-size:.85em;font-weight:700;
}
.plain{color:var(--ink-soft);font-size:.86rem;margin-top:.15rem}
.headmain{flex:1;min-width:0}
.chev{flex:none;color:var(--ink-soft);font-size:.8rem;transition:transform .25s;align-self:center}
.card.open .chev{transform:rotate(90deg)}

.card-body{display:none;padding:0 1.25rem 1.25rem 1.25rem;border-top:1px dashed var(--line)}
.card.open .card-body{display:block;animation:rise .3s cubic-bezier(.22,1,.36,1) both}
.card-body .gist{padding:1rem 0 0;font-size:.93rem;max-width:64ch}
.why{
  margin-top:.9rem;padding:.7rem .9rem;border-left:3px solid var(--rust);
  background:var(--rust-soft);border-radius:0 .5rem .5rem 0;
  font-size:.84rem;max-width:64ch;
}
.why b{color:var(--rust);font-weight:700;letter-spacing:.04em;font-size:.72rem;text-transform:uppercase;display:block;margin-bottom:.15rem}
details.deeper{margin-top:.9rem;max-width:64ch}
details.deeper summary{
  cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:.45rem;
  font-size:.8rem;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;
}
details.deeper summary::-webkit-details-marker{display:none}
details.deeper summary::before{content:'▸';transition:transform .2s;font-size:.75rem}
details.deeper[open] summary::before{transform:rotate(90deg)}
details.deeper .deep-body{padding:.7rem 0 0;font-size:.9rem;color:var(--ink)}
details.deeper .deep-body p+p{margin-top:.6rem}
.card-foot{display:flex;align-items:center;gap:.7rem;margin-top:1.1rem;flex-wrap:wrap}
.learn-btn{
  all:unset;cursor:pointer;font-size:.78rem;font-weight:700;
  padding:.42rem .95rem;border-radius:99px;border:1.5px solid var(--blue);
  color:var(--blue);letter-spacing:.03em;transition:all .15s;
}
.learn-btn:hover{background:var(--blue-soft)}
.card.learned .learn-btn{background:var(--blue);color:var(--card)}
.rel{display:flex;gap:.4rem;flex-wrap:wrap;margin-left:auto}
.rel button{
  all:unset;cursor:pointer;font-size:.7rem;padding:.28rem .65rem;border-radius:99px;
  background:var(--paper-deep);color:var(--ink-soft);border:1px solid var(--line);
}
.rel button:hover{border-color:var(--brass);color:var(--ink)}

/* ---------- workbench (exercises) ---------- */
.fw-head{margin:2.8rem 0 1.1rem}
.fw-kicker{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:.35rem}
.fw-head h3{font-family:'Fraunces',Georgia,serif;font-weight:550;font-size:1.7rem;letter-spacing:-.01em}
.fw-head p{color:var(--ink-soft);font-size:.88rem;max-width:56ch;margin-top:.3rem}
.card.ex{border-left:3px solid var(--rust)}
.card.ex .spec-id{color:var(--rust);width:4em}
.card.ex.learned .spec-id{color:var(--blue)}
.badges{display:flex;gap:.4rem;flex:none;align-self:center}
.badge{font-size:.64rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:.22rem .6rem;border-radius:99px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap}
ol.steps{margin:1rem 0 0 1.2rem;font-size:.91rem;max-width:64ch;display:flex;flex-direction:column;gap:.55rem}
.trail i.ember{background:linear-gradient(90deg,var(--rust),var(--brass))}
@media (max-width:840px){.badges{display:none}}

code{
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.86em;
  background:var(--paper-deep);padding:.1em .35em;border-radius:.3em;
}

.empty{color:var(--ink-soft);font-style:italic;padding:2rem 0;font-family:'Fraunces',Georgia,serif;font-size:1.05rem}

.pager{display:flex;justify-content:space-between;margin-top:2.4rem;gap:1rem}
.pager button{
  all:unset;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--blue);
  padding:.6rem .9rem;border-radius:.55rem;border:1px solid var(--line);background:var(--card);
  transition:border-color .15s;max-width:46%;
}
.pager button:hover{border-color:var(--blue)}
.pager button span{display:block;font-size:.66rem;color:var(--ink-soft);font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.pager .next{text-align:right;margin-left:auto}

/* mobile */
@media (max-width:840px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding-bottom:1.4rem}
  .progressbox{margin-top:.4rem}
  main{padding:1.8rem 1.2rem 4rem}
  .chapter-head h2{font-size:1.9rem}
  .rel{margin-left:0}
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="masthead">
      <h1>A Working Guide to <em>Software Engineering</em></h1>
      <div class="sub">Foundations · Architecture · Judgment</div>
    </div>
    <hr class="rule">
    <div class="searchwrap">
      <input id="search" type="search" placeholder="Search the guide…" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <nav id="nav"></nav>
    <div class="progressbox">
      <div class="label"><span>Concepts understood</span><strong id="ptext">0 / 0</strong></div>
      <div class="trail"><i id="pbar" style="width:0%"></i></div>
      <div class="label" style="margin-top:.6rem"><span>Workbench done</span><strong id="xtext">0 / 0</strong></div>
      <div class="trail"><i id="xbar" class="ember" style="width:0%"></i></div>
      <button class="sync" id="sync">⚔ Sync progress to Raava</button>
      <button class="reset" id="reset">Reset progress</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
const GUIDE = [
{
  numeral:'I', slug:'machine', title:'The Machine Underneath',
  desc:'What is actually happening when your code runs. Ten ideas that sit below every language, framework, and framework’s replacement — and that stay true when all of those change.',
  topics:[
  {id:'machine', term:'The machine model',
   plain:'A CPU in a loop: fetch an instruction, do it, repeat. Everything else is decoration.',
   gist:'Underneath every abstraction is a processor executing simple instructions in sequence — load a number from memory, add, compare, jump elsewhere. Your elegant class hierarchy, your async pipeline, your React component: all of it becomes a linear stream of these. Nothing your program does is magic; it is only far away from the metal.',
   why:'When you can no longer read the code you shipped, you fall back on reasoning about what it must be doing. A mental model of the machine is what lets you predict behavior you did not write.',
   deeper:'<p>Three facts about the CPU do most of the explanatory work. It executes <b>one instruction stream per core</b> (so a single-threaded program cannot use eight cores). It <b>only operates on registers</b> — a handful of tiny slots — so data must be shuttled in from memory and back. And it <b>guesses</b>: modern CPUs pipeline and speculate ahead through branches, which is why unpredictable <code>if</code> statements in a hot loop cost more than predictable ones.</p><p>You do not need assembly to be a strong engineer. You do need to stop treating the runtime as an oracle: every abstraction is a program someone else wrote, running on this same loop.</p>',
   rel:['memory','abstraction','io']},
  {id:'memory', term:'The stack and the heap',
   plain:'Two ways to hold data: a fast disciplined stack, a flexible expensive heap.',
   gist:'The stack is scratch space for function calls: each call pushes a frame holding its local variables, and returning pops it — automatic, ordered, and extremely fast. The heap is a large pool for anything whose size or lifetime is not known in advance: allocation costs more, and someone must decide when the memory is released.',
   why:'Almost every memory bug, leak, and “why is this object still alive?” puzzle is a question about which of these two regions a value lives in and who holds a reference to it.',
   deeper:'<p>This split explains the questions languages disagree about. C makes you free heap memory manually (leaks and use-after-free). Rust ties lifetime to ownership and checks it at compile time. Java, Go, Python and JavaScript run a <b>garbage collector</b> that periodically finds unreachable heap objects — which is why those languages have GC pauses and why you can still “leak” by keeping a reference in a long-lived cache or listener list.</p><p>The stack is also finite (typically ~1–8 MB). Infinite recursion exhausts it, which is a <code>StackOverflowError</code> — a different failure from running out of heap, which is <code>OutOfMemory</code>.</p>',
   rel:['callstack','machine','state']},
  {id:'bytes', term:'Everything is bytes',
   plain:'Numbers, text, images, your code — all the same thing, interpreted differently.',
   gist:'Memory holds only bytes. What a byte <em>means</em> comes from the type you view it through: the same 32 bits are an integer, a float, or four characters depending on the interpretation. Every representation has edges — integers overflow, floats cannot represent 0.1 exactly, text needs an encoding to become bytes and back.',
   why:'This is where silent, expensive bugs live: money stored as floats, a name that breaks on a non-ASCII character, an ID that overflows at 2,147,483,647. They pass tests and fail in production.',
   deeper:'<p>Three edges worth internalizing. <b>Integer overflow</b>: fixed-width integers wrap or trap; use 64-bit for anything counting real-world things. <b>Floating point</b>: binary fractions cannot represent most decimal fractions, so <code>0.1 + 0.2 !== 0.3</code> — never use floats for currency; use integer cents or a decimal type. <b>Text</b>: a string is bytes plus an encoding (use UTF-8 everywhere), and “length” is ambiguous — bytes, code points, and user-perceived characters all differ for emoji and accented text.</p><p>Serialization is this same idea at the boundary: JSON, Protobuf, and CSV are just agreements about how to turn structured values into bytes and back without losing meaning.</p>',
   rel:['types','modeling','io']},
  {id:'compilation', term:'Compilation, interpretation, and runtimes',
   plain:'The gap between the text you write and the instructions that run.',
   gist:'Source code must become machine instructions somehow. A compiler translates the whole program ahead of time (C, Rust, Go); an interpreter walks the source or a bytecode form as it runs (Python, Ruby); most modern systems are hybrids that compile hot paths just-in-time (JVM, V8, .NET). The result is a spectrum from “fast start, slow run” to “slow start, fast run”.',
   why:'Build steps, bundlers, transpilers, and “works on my machine” problems are all this pipeline leaking. Knowing the stages tells you where to look when the artifact does not match the source.',
   deeper:'<p>Stages, roughly: <b>parse</b> source into a syntax tree, <b>analyze</b> it (resolve names, check types), <b>optimize</b>, and <b>emit</b> code. Errors are named after the stage that caught them — syntax error, type error, link error, runtime error — and the earlier the stage, the cheaper the bug.</p><p>The runtime is the part that stays with you: garbage collector, scheduler, standard library, dynamic linker. “The language is slow” is usually a claim about a runtime, not about syntax. And every JIT means your first request is slower than your thousandth — an effect that quietly ruins naive benchmarks.</p>',
   rel:['types','measure','machine']},
  {id:'types', term:'Types',
   plain:'A promise about what a value can be, checked by a machine instead of by hope.',
   gist:'A type constrains the set of values a variable can hold and the operations allowed on it. Static typing checks those promises before the program runs; dynamic typing checks at the moment of use. The value of a type is not ceremony — it is that a whole category of mistakes becomes unrepresentable.',
   why:'Types are the cheapest specification you can write, and the only one a machine will enforce for free on code you did not write yourself.',
   deeper:'<p>Two axes people conflate. <b>Static vs dynamic</b>: when checking happens. <b>Strong vs weak</b>: how much implicit coercion is allowed. Python is dynamic but fairly strong; JavaScript is dynamic and famously weak (<code>[] + {}</code>).</p><p>The design skill is <b>making illegal states unrepresentable</b>. A <code>User</code> with <code>email: string | null</code> and <code>verified: boolean</code> allows a verified user with no email; modelling it as <code>Unverified | Verified{email}</code> deletes that bug permanently. Rich types (sum types, newtypes, non-empty lists, branded IDs) push errors from runtime to compile time, which is the whole game.</p>',
   rel:['contracts','static','invariants']},
  {id:'state', term:'State and mutation',
   plain:'The values your program remembers — and the source of most of its difficulty.',
   gist:'State is everything your program is currently holding: variables, objects, files, database rows, the contents of a cache. A pure calculation is easy to reason about because it depends only on its inputs. State breaks that: the same call can now do different things depending on what happened earlier, and correctness becomes a claim about history rather than about a line of code.',
   why:'“Where does this value change?” is the question that dominates debugging. Designs that concentrate and constrain state stay understandable; designs that scatter it do not.',
   deeper:'<p>State multiplies your program’s possible situations. Three independent booleans mean eight states; add a nullable field and a retry counter and you are past what anyone can hold in their head. This is why the practical advice is always the same shape: <b>keep state small</b>, <b>keep it in one place</b>, <b>make transitions explicit</b> (state machines beat scattered flags), and <b>prefer deriving over storing</b> — a value you compute cannot go stale.</p>',
   rel:['purity','invariants','sourceoftruth']},
  {id:'callstack', term:'Functions and the call stack',
   plain:'Calls nest; the stack remembers how to get back. Stack traces are that memory, printed.',
   gist:'Calling a function pushes a frame with its arguments, locals, and the address to return to. That chain of frames is the call stack — the reason a stack trace can show you the whole path from <code>main</code> to the line that threw. Recursion is nothing more than a function that pushes a frame for itself, which is why it needs a base case and why deep recursion exhausts the stack.',
   why:'Reading a stack trace correctly — bottom is where you started, top is where it broke, and the interesting frame is usually neither — is the single fastest debugging skill there is.',
   deeper:'<p>Async code complicates this: when a callback or promise resolves, the original stack is long gone, which is why async stack traces are often useless without runtime support. Same for threads — each thread has its own stack.</p><p><b>Tail-call optimization</b> lets some languages reuse a frame when a call is the very last act of a function, making deep recursion safe (Scheme, Haskell, some Scala). Most mainstream runtimes do not do it, so convert deep recursion to iteration with an explicit stack when depth is unbounded.</p>',
   rel:['memory','recursion','debugging']},
  {id:'os', term:'Processes, threads, and the OS',
   plain:'The operating system is the landlord: it hands out CPU time, memory, and access to hardware.',
   gist:'A process is a running program with its own private memory space; threads are multiple execution paths inside one process, sharing that memory. Your code cannot touch hardware directly — it asks the kernel through a system call, which is why file reads, network sends, and even memory allocation are conversations with the OS rather than raw instructions.',
   why:'Containers, ports, permissions, zombie processes, “too many open files” — all of it is OS behavior surfacing. It is the layer most people skip and most incidents live in.',
   deeper:'<p>Sharing memory is exactly why threads are fast and dangerous: two threads mutating the same structure is a data race unless coordinated. Separate processes cannot corrupt each other but must communicate through pipes, sockets, or shared files.</p><p>Worth knowing by name: <b>file descriptors</b> (a small integer for every open file or socket — leaking them takes down servers), <b>signals</b> (SIGTERM asks politely, SIGKILL does not — graceful shutdown means handling the first), <b>the scheduler</b> (why your process pauses even when it has work), and <b>virtual memory</b> (every process sees its own address space; the kernel maps it to real RAM).</p>',
   rel:['concurrency','races','failure']},
  {id:'io', term:'I/O is where the time goes',
   plain:'CPU work is nanoseconds; disk and network are millions of times slower. Learn the ladder.',
   gist:'Reading from L1 cache takes about a nanosecond; main memory around a hundred; an SSD read tens of microseconds; a round trip across a data center half a millisecond; across the world, hundreds. On that scale a database call is not “a bit slower” than a function call — it is the difference between a second and a month.',
   why:'Nearly every real performance problem is an I/O problem, usually an accidental one: a query inside a loop, a synchronous call in a hot path, a chatty API. Optimizing algorithms while ignoring this is a common and expensive mistake.',
   deeper:'<p>A ladder worth memorizing (orders of magnitude, not exact): L1 ~1 ns · main memory ~100 ns · SSD read ~50 µs · same-datacenter round trip ~0.5 ms · disk seek ~5 ms · US↔Europe round trip ~100 ms.</p><p>The consequences follow directly: <b>batch</b> instead of looping (the N+1 query problem), <b>cache</b> what is expensive and stable, <b>parallelize</b> independent waits, and <b>move computation to the data</b> rather than dragging data to computation. Note also that waiting on I/O does not burn CPU — which is why one thread can juggle thousands of idle connections (see async).</p>',
   rel:['caching','async','measure']},
  {id:'abstraction', term:'Abstraction, and where it leaks',
   plain:'Hiding detail so you can think about more at once — until the detail comes back.',
   gist:'Every layer of software exists to let you use something without understanding all of it: a file system hides disk sectors, TCP hides packet loss, an ORM hides SQL. Abstraction is the fundamental tool of the discipline. It is also always incomplete — under load, under failure, or at the edges, the hidden detail reasserts itself.',
   why:'The abstractions are getting taller and are increasingly generated for you. Value now sits with the people who can drop a level when the abstraction leaks — because everyone can operate the happy path.',
   deeper:'<p>Spolsky’s <b>Law of Leaky Abstractions</b>: all non-trivial abstractions leak to some degree. TCP promises reliable delivery, but on a bad network the promise is kept slowly, and your timeout fires. An ORM promises objects, until it emits 400 queries for one page. Serverless promises no servers, until you meet cold starts.</p><p>The practical rule: <b>learn one layer below the one you work in</b>. Write SQL if you use an ORM; know HTTP if you use a client library; know the event loop if you write async code. Not every layer — just the next one down. That is where the leaks appear.</p>',
   rel:['layering','decomposition','contracts']},
],
  ex:[
  {id:'x-latency', title:'Build your own latency ladder', time:'40 min', level:'Hands-on',
   plain:'Measure the six numbers that explain most performance problems, on your own machine.',
   steps:'<li>Write a timing harness that runs an operation a million times and reports nanoseconds per operation.</li><li>Measure, in order: an in-memory array sum, a random access into a 1 GB array (cache miss), a small file read, a <code>localhost</code> HTTP request, a query against a local database, and an HTTPS request to a server on another continent.</li><li>Write the six numbers on an index card, in orders of magnitude. Look at how many zeros separate the top from the bottom.</li><li>Now find one place in code you own where a fast operation sits inside a loop around a slow one. That is your next optimization, and you found it by arithmetic instead of guessing.</li>',
   hint:'<p>Beware the JIT and the OS page cache: warm up before you measure, and read a fresh file each iteration or you will be timing RAM. If a number looks impossibly good, you are measuring the wrong thing — which is itself the most useful lesson in benchmarking.</p>',
   rel:['io','measure','caching']},
  {id:'x-bytes', title:'Make the representation lie to you', time:'25 min', level:'Gentle',
   plain:'Reproduce the four classic representation bugs in ten minutes, so you never ship them.',
   steps:'<li>In any REPL: evaluate <code>0.1 + 0.2</code>, then sum <code>0.1</code> a hundred times and compare to <code>10</code>. Now redo it in integer cents.</li><li>Overflow a 32-bit integer deliberately (in Java/Go/C, or with <code>Int32Array</code> in JS) and watch a large positive number become negative.</li><li>Take the string <code>"café 👩‍💻"</code> and print its byte length, its code-point length, and what your language calls <code>.length</code>. Reverse it and see what breaks.</li><li>Encode it to UTF-8, decode it as Latin-1, and admire the mojibake — the exact bug behind every garbled name in every database you will ever inherit.</li>',
   rel:['bytes','types','modeling']},
  {id:'x-stack', title:'Exhaust the stack, then don’t', time:'30 min', level:'Gentle',
   plain:'Feel the difference between stack and heap by running out of one of them.',
   steps:'<li>Write a recursive function with no base case. Run it. Note the exact error and the depth it reached before dying.</li><li>Write a loop that appends to a list forever. Note that this error is different, arrives later, and often takes the machine down with it.</li><li>Rewrite a genuinely recursive task (walking a deeply nested directory tree, or a JSON document) as an iterative loop with an explicit stack you push and pop yourself. Confirm it survives depths that crashed the recursive version.</li><li>Read your original stack trace once more and name every frame in it. Traces stop being noise once you have written one on purpose.</li>',
   rel:['callstack','memory','recursion']},
  {id:'x-syscall', title:'Watch a program talk to the kernel', time:'30 min', level:'Hands-on',
   plain:'See the syscalls behind a one-line file read — and count the ones you didn’t know about.',
   steps:'<li>Write a three-line program that opens a file, reads it, and prints its length.</li><li>Trace it: <code>strace -c ./prog</code> on Linux, or <code>sudo dtruss ./prog</code> on macOS. Count how many system calls a “simple” program makes before it reaches your first line.</li><li>Find <code>openat</code>, <code>read</code>, <code>mmap</code>, and <code>close</code> in the output, and match them to lines of your code.</li><li>Now trace a <code>curl</code> to any URL and locate the DNS lookup, the TCP connect, and the TLS handshake. You have just seen every layer of chapter V from below.</li>',
   rel:['os','io','network']},
]},
{
  numeral:'II', slug:'structures', title:'Structures & Cost',
  desc:'How data is arranged decides what a program can afford. This is the chapter that turns “it feels slow” into a diagnosis you can defend.',
  topics:[
  {id:'bigo', term:'Big-O and the cost of growth',
   plain:'Not how fast it is — how much worse it gets as the input grows.',
   gist:'Big-O describes the shape of a cost curve, ignoring constants and hardware. O(1) is flat, O(log n) barely rises, O(n) is proportional, O(n log n) is the price of sorting, O(n²) is the nested loop that kills you at scale, and O(2ⁿ) is a research problem. It answers one question: if the data gets ten times bigger, what happens?',
   why:'It is the shared language for arguing about a design before anyone writes it — and the fastest way to spot the O(n²) hidden inside code that looks perfectly reasonable.',
   deeper:'<p>Two honest caveats. <b>Constants matter at real sizes</b>: an O(n) scan of a contiguous array often beats an O(1) hash lookup for small n, because memory locality beats theory. And <b>Big-O hides the operation being counted</b> — O(n) disk reads and O(n²) integer comparisons are not comparable.</p><p>Also track <b>space</b> complexity, not just time; and know the difference between <b>worst case</b> (what your SLA must survive), <b>average case</b> (what your dashboard shows), and <b>amortized</b> cost. Hash tables are O(1) average and O(n) worst — which is exactly the gap an attacker aims at with crafted collision keys.</p>',
   rel:['amortized','choosing','measure']},
  {id:'arrays', term:'Arrays and contiguous memory',
   plain:'One unbroken block. Instant indexing, expensive insertion, and beloved by the CPU cache.',
   gist:'An array stores elements side by side, so element <em>i</em> is found by arithmetic — O(1), no searching. The costs are the mirror image: inserting or deleting in the middle means shifting everything after it, and growing means allocating a bigger block and copying. Dynamic arrays (Python lists, Java <code>ArrayList</code>, JS arrays, Go slices) hide this by over-allocating.',
   why:'Contiguity is why arrays are quietly the fastest structure on modern hardware, and why a “more sophisticated” structure often loses to a plain array in practice.',
   deeper:'<p>The CPU never loads one value; it loads a <b>cache line</b> (typically 64 bytes) containing its neighbors. Walking an array therefore gets its next several elements free, while chasing pointers around the heap pays full memory latency each hop. This single effect routinely makes arrays several times faster than linked structures for the same Big-O.</p><p>The same insight scales up: column-oriented databases store each field contiguously so an aggregate over one column reads only what it needs. Data layout is a performance decision, not a detail.</p>',
   rel:['linked','bigo','io']},
  {id:'linked', term:'Linked structures and references',
   plain:'Nodes scattered in memory, each pointing to the next. Cheap surgery, slow traversal.',
   gist:'A linked list holds elements in separate heap nodes joined by references. Inserting or removing is O(1) once you hold the right node — nothing shifts. But there is no indexing (finding the tenth item means ten hops), and each hop is a potential cache miss. Trees, graphs, and most object models are linked structures underneath.',
   why:'Understanding references — that two variables can name the same object — is the prerequisite for reasoning about mutation, aliasing, equality, and every “why did that change?” bug.',
   deeper:'<p>Linked lists are rarer in application code than interview questions suggest, but the underlying idea is everywhere: an object graph, a DOM tree, a linked queue in a scheduler, a chain of promises. What matters is the shared consequences — <b>aliasing</b> (mutating through one reference is visible through another), <b>identity vs equality</b> (same object, or merely equal contents?), and <b>reachability</b> (an object stays alive as long as something references it — the mechanism behind both garbage collection and memory leaks).</p>',
   rel:['arrays','memory','purity']},
  {id:'hashmap', term:'Hash maps',
   plain:'The workhorse: near-instant lookup by key, in exchange for order and worst-case guarantees.',
   gist:'A hash function turns a key into an array index, so lookup, insert, and delete are O(1) on average regardless of size. Collisions (two keys landing in the same slot) are handled by chaining or probing. Dictionaries, objects, caches, indexes, sets, deduplication — most of them are a hash map wearing a costume.',
   why:'“Can I replace this scan with a lookup?” converts more O(n²) loops into O(n) than any other single move in everyday programming.',
   deeper:'<p>Things that bite people. <b>Hash and equality must agree</b>: two equal keys must hash identically, so mutating a key after insertion loses it forever — use immutable keys. <b>Iteration order</b> is not guaranteed (Python 3.7+ and JS insertion order are conveniences, not universal). <b>Worst case is O(n)</b> when everything collides, which is a real denial-of-service vector — hence randomized seeds in modern runtimes.</p><p>Memory is the trade: hash maps stay fast by keeping spare capacity (a load factor around 0.75) and rehashing everything when they outgrow it.</p>',
   rel:['arrays','trees','indexes']},
  {id:'trees', term:'Trees and sorted order',
   plain:'Hierarchy with O(log n) search — and the only structure that answers range questions.',
   gist:'A balanced search tree keeps keys ordered so every comparison halves the remaining space: a million items in twenty steps. Unlike a hash map it preserves order, so it can answer “everything between March and June” and “the next key after this one”. Trees also model hierarchy directly: file systems, the DOM, syntax trees, org charts.',
   why:'Database indexes are B-trees. Understanding why a tree is fast for ranges and prefixes, and useless for “contains this substring”, is what makes query plans readable rather than mystical.',
   deeper:'<p><b>Balance</b> is the whole trick — an unbalanced tree degenerates into a linked list, so real implementations self-balance (red-black, AVL). A <b>B-tree</b> is the disk-friendly variant: wide nodes sized to a page, so each expensive read carries hundreds of keys. That is why it powers Postgres, MySQL, and SQLite.</p><p>Two relatives worth knowing: <b>tries</b> (prefix trees for autocomplete and routing) and <b>heaps</b> (a tree shape giving O(1) access to the smallest element — the guts of priority queues and schedulers).</p>',
   rel:['hashmap','indexes','graphs']},
  {id:'graphs', term:'Graphs and traversal',
   plain:'Nodes and edges — the shape of dependencies, networks, and almost everything relational.',
   gist:'A graph is the general case: things and the connections between them. Two traversals cover most needs — breadth-first (explore by distance, gives shortest paths on unweighted graphs) and depth-first (follow a path to its end, gives cycle detection and topological order). Your import graph, service topology, permission model and social features are all graphs.',
   why:'Build order, dependency resolution, deadlock detection, blast-radius analysis, and “what breaks if this service dies?” are all one algorithm on a graph you already have.',
   deeper:'<p>The vocabulary earns its keep: <b>directed vs undirected</b>, <b>cyclic vs acyclic</b>, <b>weighted</b> edges. A <b>DAG</b> (directed acyclic graph) is the shape of every build system, migration chain, and task pipeline — and <b>topological sort</b> is the algorithm that answers “what order can these run in?” while detecting the circular dependency if there is one.</p><p>Cycles are where systems break: circular imports, mutually-referencing services, deadlocked lock acquisition. Detecting a cycle is a depth-first search that finds an edge back to a node still on the stack — and it is worth being able to write from memory.</p>',
   rel:['trees','recursion','layering']},
  {id:'sorting', term:'Sorting and searching',
   plain:'Sorting costs O(n log n) once and makes many later questions cheap.',
   gist:'You will rarely implement a sort, but you must know what sorting buys: binary search in O(log n), efficient deduplication, merge joins, grouping, and range scans. The practical questions are whether the sort is <b>stable</b> (does it preserve the order of equal elements?), what the comparison function actually costs, and whether the data fits in memory.',
   why:'Sorting is the clearest example of the central trade: pay an ordering cost once to make every subsequent query cheap. Indexes, search engines, and log-structured storage are all that same bargain.',
   deeper:'<p>Practical knowledge over trivia: real libraries use hybrids (Timsort in Python and Java, pattern-defeating quicksort in C++ and Rust) that exploit partially-sorted input — so nearly-sorted data sorts nearly linearly. <b>Comparison sorts cannot beat O(n log n)</b>, but counting/radix sorts can when keys are small integers.</p><p>Two traps. Sorting by an unstable key gives non-deterministic pagination — always add a tiebreaker such as an ID. And a comparator must be consistent (transitive and antisymmetric) or the sort may crash or produce nonsense; a comparator that calls out to a database is the same sin as a query in a loop.</p>',
   rel:['bigo','indexes','trees']},
  {id:'recursion', term:'Recursion and divide-and-conquer',
   plain:'Solve a big problem by solving smaller versions of it and combining the answers.',
   gist:'A recursive solution has two parts: a base case small enough to answer directly, and a step that reduces the problem toward it. Divide-and-conquer is the powerful variant — split in half, solve both, merge — which is where O(n log n) comes from. Recursion is the natural fit whenever the data is itself recursive: trees, nested documents, expressions, file systems.',
   why:'Recursion is a way of thinking about problems, not just a way of writing loops. Being fluent in it is what lets you decompose an unfamiliar problem instead of staring at it.',
   deeper:'<p>Two failure modes and their fixes. <b>Depth</b>: recursion consumes stack frames, so unbounded depth needs an explicit stack instead. <b>Repeated work</b>: naive recursive Fibonacci recomputes the same values exponentially — <b>memoization</b> (cache results by argument) collapses it to linear, and that leap from exponential to linear is the whole content of dynamic programming.</p><p>The design habit worth stealing: state a precise contract for the function (“returns the sorted version of this sublist”), then trust it holds for the recursive call. Recursion is induction, and induction is proof.</p>',
   rel:['callstack','trees','graphs']},
  {id:'queues', term:'Stacks, queues, and priority queues',
   plain:'Three tiny structures that quietly determine how a system behaves under load.',
   gist:'A stack is last-in-first-out (undo, call frames, backtracking). A queue is first-in-first-out (work pipelines, request buffers, fairness). A priority queue always yields the most important item next (schedulers, timers, Dijkstra). They are small in code and enormous in consequence: choosing one is choosing a policy about who waits.',
   why:'Every buffer, thread pool, and message broker is one of these. Understanding queue behavior is what turns “the site is slow under load” into “the queue is growing without bound, so latency is unbounded”.',
   deeper:'<p><b>Little’s Law</b> is the piece of queueing theory every engineer should carry: average items in a system = arrival rate × average time in system. It follows that if arrivals exceed service rate for any sustained period, the queue and the latency both grow without limit — no amount of retrying helps, and the only cures are more capacity, less work, or shedding load.</p><p>Which is why unbounded queues are a design smell: they convert a fast failure into a slow, invisible one. A bounded queue that rejects work is usually kinder than an infinite queue that hides collapse.</p>',
   rel:['messaging','failure','amortized']},
  {id:'amortized', term:'Amortized cost and the tail',
   plain:'The average is fine and every hundredth user is furious. Averages hide the failure.',
   gist:'Amortized analysis spreads occasional expensive operations across many cheap ones — appending to a dynamic array is O(1) amortized even though one append in n triggers a full copy. That is honest for throughput, but it says nothing about the individual request that paid the whole bill. Latency lives in percentiles: p50, p95, p99.',
   why:'Users experience the tail, not the mean. And in any request that fans out to ten services, the p99 of each becomes the typical experience of the whole — tail latency compounds.',
   deeper:'<p>Sources of tail latency you will actually meet: garbage-collection pauses, cache misses, hash-map or array resizing, connection pool exhaustion, a lock held slightly too long, and retries piling onto an already-slow dependency.</p><p>Two habits follow. <b>Never report a mean latency</b> — it is dominated by the fast path and hides everything that matters. And prefer <b>predictable</b> costs to <b>fast average</b> costs in latency-sensitive paths: an incremental structure that never pauses may beat one that is faster on average but stalls for 200 ms.</p>',
   rel:['bigo','measure','observability']},
  {id:'choosing', term:'Choosing the right structure',
   plain:'Start from the questions you must answer, not from the data you happen to have.',
   gist:'The decision procedure is short. List the operations and their frequencies: lookup by key, iterate in order, insert at the end, delete from the middle, find a range, find the maximum. Then pick the structure whose cheap operations match your frequent ones. Hash map for keyed lookup, array for iteration and indexing, tree or sorted array for ranges, heap for “next most urgent”, set for membership and dedup.',
   why:'This is the same reasoning as choosing a database, an index, or a cache — and it is exactly the judgment that generated code cannot exercise for you, because it depends on access patterns only you know.',
   deeper:'<p>Two rules of thumb that survive contact with reality. <b>Start with the simplest thing (usually an array or a hash map) and change it when a measurement says to</b> — most data is small, and small data makes every structure fast. And <b>measure with realistic sizes</b>: an algorithm chosen for a thousand rows may be catastrophic at ten million, so know which regime you are designing for and write it down.</p><p>When one structure cannot serve two access patterns, the standard answer is to maintain two views of the same data — which is precisely what a database index is, and which is why you now own a consistency problem (see chapter IV).</p>',
   rel:['bigo','indexes','tradeoffs']},
],
  ex:[
  {id:'x-quadratic', title:'Watch O(n²) meet real data', time:'35 min', level:'Gentle',
   plain:'Feel the difference between a nested loop and a hash lookup, at four input sizes.',
   steps:'<li>Write the naive version: given two lists, find the common elements with a nested loop. Time it at n = 1,000 / 10,000 / 50,000.</li><li>Plot or just eyeball the numbers: ten times the input should be roughly a hundred times the time. Confirm it.</li><li>Rewrite it with a set or hash map, one pass each. Re-time at the same sizes, then at n = 1,000,000 — which the first version could never reach.</li><li>Now grep code you own for a loop inside a loop over the same collection. That is the same bug, waiting for your data to grow.</li>',
   rel:['bigo','hashmap','measure']},
  {id:'x-hashmap', title:'Build a hash map in sixty lines', time:'60 min', level:'Keystone',
   plain:'Implement buckets, collisions, and resizing — then you will never mis-trust one again.',
   steps:'<li>Implement <code>put</code>, <code>get</code>, and <code>delete</code> over an array of buckets, using a simple hash and chaining for collisions.</li><li>Add resizing: when load factor passes 0.75, double the array and rehash everything. Notice that one <code>put</code> in many is enormously expensive — amortized cost, felt directly.</li><li>Break it on purpose: make every key hash to the same bucket and watch O(1) become O(n).</li><li>Break it a second way: insert an object as a key, then mutate the field its hash depends on, and try to get it back. That is why keys must be immutable.</li>',
   hint:'<p>Keep it honest and small — no clever bit tricks. The point is the shape: array + hash + collision policy + resize. Every dictionary you have ever used is this, tuned.</p>',
   rel:['hashmap','amortized','bytes']},
  {id:'x-locality', title:'Prove that memory layout matters', time:'30 min', level:'Hands-on',
   plain:'Same Big-O, same operations, several times the speed — decided purely by layout.',
   steps:'<li>Allocate a large 2-D matrix (say 4000×4000) and sum it row-major (walking along rows), then column-major (jumping down columns). Same number of additions.</li><li>Time both. The row-major version is typically several times faster, purely from cache lines.</li><li>Now compare summing one field across an array of objects versus a plain array of that field alone (structs-of-arrays). Same result, different memory story.</li><li>Write the ratio down. It is your standing evidence that Big-O is necessary but not sufficient.</li>',
   rel:['arrays','io','measure']},
  {id:'x-depgraph', title:'Turn your codebase into a graph', time:'45 min', level:'Hands-on',
   plain:'Extract the import graph, topologically sort it, and find the cycles you did not know about.',
   steps:'<li>Parse imports from a project you know (a regex over source files is plenty) and build an adjacency map of module → modules it imports.</li><li>Run a depth-first search that detects cycles — an edge to a node still on the current stack. Print any you find.</li><li>Topologically sort the acyclic part. The result is a legitimate build order, and the layers it reveals are your architecture as it actually is, not as documented.</li><li>Find the module with the most inbound edges. That is your highest-risk file: everything depends on it, so every change there has maximum blast radius.</li>',
   rel:['graphs','layering','coupling']},
]},
{
  numeral:'III', slug:'design', title:'Abstraction & Design',
  desc:'Deciding what the pieces are and where the seams go. This is the least automatable part of the job, and the chapter to reread most often.',
  topics:[
  {id:'decomposition', term:'Decomposition',
   plain:'Splitting a problem into parts you can think about one at a time.',
   gist:'Human working memory holds a handful of things. A system holds thousands. Decomposition is the bridge: break the whole into parts small enough to understand alone, with relationships simple enough to understand together. Every design principle that follows is a heuristic for cutting well.',
   why:'A model can write any single part. Deciding what the parts <em>are</em> — and being right — determines whether the next hundred changes are easy or agonizing. That decision compounds; the implementation does not.',
   deeper:'<p>A good cut has three properties: each part <b>does one thing</b>, each part can be <b>understood without reading the others</b>, and a likely change touches <b>one part</b> rather than five. That last one is the real test — decompose along axes of change, not along nouns in the requirements document.</p><p>The classic misfire is splitting by technical layer when your changes arrive by feature. If adding “refunds” means editing a controller, a service, a repository, a DTO, and a validator across five directories, your decomposition is fighting your workload — and no amount of code quality inside those files will fix it.</p>',
   rel:['coupling','encapsulation','change']},
  {id:'coupling', term:'Coupling and cohesion',
   plain:'Things that change together belong together; things that don’t should not know about each other.',
   gist:'Coupling measures how much one module depends on the internals of another; cohesion measures how strongly the contents of a module belong together. The perennial goal is low coupling and high cohesion — because coupling is what makes a small change ripple, and low cohesion is what makes a module impossible to name.',
   why:'Coupling is the true unit of technical debt. It is also the property that survives a rewrite of every line: you can regenerate an implementation cheaply, but a tangled dependency structure has to be untangled by hand.',
   deeper:'<p>Coupling comes in grades, from tolerable to toxic: <b>data coupling</b> (passing a value) is fine; <b>stamp coupling</b> (passing a whole object to use one field) is wasteful; <b>control coupling</b> (passing a flag that switches behavior) is a smell; <b>content coupling</b> (reaching into another module’s internals or database tables) is the one that ends careers.</p><p>A practical diagnostic: if you cannot test module A without constructing half of module B, they are coupled. If a file’s name needs the word “and”, or is called <code>utils</code>, it has low cohesion. Both are measurable enough to act on.</p>',
   rel:['decomposition','contracts','layering']},
  {id:'contracts', term:'Interfaces and contracts',
   plain:'The promise a component makes, stated separately from how it keeps it.',
   gist:'An interface is what a caller may rely on: the operations, the parameters, the guarantees, the errors, and the conditions under which it works. It is a contract in the literal sense — a caller that respects the preconditions is owed the postconditions. Everything not in the contract is free to change without warning.',
   why:'Contracts are how you can safely use code you have not read — including code generated in ten seconds. A well-specified boundary makes the implementation behind it disposable, which is precisely the property you want now.',
   deeper:'<p>A complete contract states more than a type signature: <b>preconditions</b> (what must be true to call it), <b>postconditions</b> (what will be true after), <b>invariants</b> (what stays true throughout), <b>error behavior</b> (what it throws or returns when it cannot comply), and increasingly <b>operational</b> terms — is it idempotent, is it thread-safe, how long may it block?</p><p>Design contracts <b>narrow in, generous out</b> (accept the least you need, promise the most you can), and remember Hyrum’s Law: with enough users, every observable behavior of your system becomes something someone depends on, whether or not you promised it.</p>',
   rel:['encapsulation','api','types']},
  {id:'encapsulation', term:'Encapsulation and information hiding',
   plain:'Hide the decisions most likely to change behind an interface that will not.',
   gist:'Parnas’s original insight was not about keeping fields private — it was about which information a module hides. You identify the decisions likely to change (a storage format, an algorithm, a third-party vendor) and place each behind a boundary, so that when it changes, exactly one module changes with it.',
   why:'Volatility is the thing to encapsulate, and in this era volatility includes entire implementation strategies. Whether a component is hand-written, generated, or delegated to a model should be an internal detail nobody else can observe.',
   deeper:'<p>The test question is not “is this field private?” but “what would break if this decision changed tomorrow?” If swapping the payment provider means touching forty files, the vendor was never encapsulated no matter how many interfaces you declared.</p><p>The common anti-pattern is the <b>anemic wrapper</b>: a class whose getters and setters expose every internal field, so callers reassemble the logic themselves. That is encapsulation as ritual. Real encapsulation means the caller cannot express an invalid operation because the interface does not offer one.</p>',
   rel:['contracts','invariants','change']},
  {id:'invariants', term:'Invariants',
   plain:'Statements that are always true. Design so that breaking one is impossible, not merely rare.',
   gist:'An invariant is a property your system guarantees: an order always has at least one line item, a balance never goes negative, a tree is always balanced, every user record has a unique email. Bugs are invariant violations. The design skill is deciding which invariants exist, who enforces them, and where the enforcement lives.',
   why:'Invariants are executable specifications. When the volume of code being produced rises, the leverage moves from checking each line to stating the properties that all of it must satisfy.',
   deeper:'<p>Enforcement, from strongest to weakest: make it <b>unrepresentable</b> in the type system (a <code>NonEmptyList</code> cannot be empty); enforce it at <b>construction</b> (a constructor that validates, so an invalid object never exists); enforce it in the <b>database</b> (constraints, foreign keys, unique indexes); assert it at <b>runtime</b>; or check it in a <b>test</b>. Push as far up that list as the language allows — cheaper checks fail earlier and more loudly.</p><p>A rule that saves enormous pain: <b>validate at the boundary, then trust inside</b>. Parse untrusted input once into a type that guarantees validity, rather than re-checking the same string in twelve functions and eventually forgetting in one.</p>',
   rel:['types','contracts','property']},
  {id:'purity', term:'Purity and immutability',
   plain:'A function with no memory and no side effects is one you can fully understand alone.',
   gist:'A pure function returns the same output for the same input and changes nothing outside itself. Immutable data cannot be modified after creation — you make a new version instead. Together they eliminate a whole species of bug: nothing changes behind your back, so a value you hold is a value you can trust.',
   why:'Pure functions are the easiest code in the world to test, cache, parallelize, and verify — which makes them the safest place to put logic you did not write by hand.',
   deeper:'<p>Programs must eventually do impure things — write files, call services, print. The durable pattern is the <b>functional core, imperative shell</b>: keep decision-making logic pure and push I/O to a thin outer layer. The core becomes trivially testable without mocks; the shell is small enough to verify by inspection.</p><p>Immutability also buys thread safety for free — a value that never changes cannot be involved in a data race — which is why it underpins React’s rendering, Redux, Clojure, event sourcing, and Git itself. The cost is copying, which structural sharing (persistent data structures) makes far cheaper than it sounds.</p>',
   rel:['state','concurrency','testing']},
  {id:'composition', term:'Composition over inheritance',
   plain:'Assemble behavior from parts you hold, rather than inheriting it from ancestors.',
   gist:'Inheritance couples a subclass to its parent’s internals permanently and forces a single rigid taxonomy — and real domains refuse to be taxonomies. Composition builds objects from smaller collaborators passed in, so behavior can be swapped, tested, and recombined. “Has-a” survives changing requirements far better than “is-a”.',
   why:'Deep class hierarchies are the classic way a codebase becomes unreadable to a newcomer — human or machine — because behavior lives in five files none of which contain the method you are reading.',
   deeper:'<p>The canonical failure is the <b>fragile base class</b>: an innocuous change in a parent silently breaks subclasses that depended on its internal call order. The <b>Liskov Substitution Principle</b> states the constraint precisely — a subtype must be usable anywhere its supertype is, without surprises — and most inheritance hierarchies violate it within a year.</p><p>Inheritance is still right for genuine, stable is-a relationships and for interface implementation. The reliable rule: <b>inherit interfaces, compose implementations</b>. And when you catch yourself adding a boolean flag to a base class to make one subclass behave differently, you have already outgrown the hierarchy.</p>',
   rel:['contracts','layering','change']},
  {id:'naming', term:'Naming',
   plain:'The cheapest documentation and the highest-leverage design feedback you will get.',
   gist:'Names are the interface between your code and the next person’s understanding. Good names say what a thing is and what it guarantees, at the level of the domain rather than the mechanism — <code>overdueInvoices</code>, not <code>filteredList2</code>. Naming is also a design test: a thing that resists naming is usually a thing that does too much.',
   why:'Precise domain vocabulary is now literally the input to code generation as well as to comprehension. Ambiguity in a name propagates into everything built on top of it.',
   deeper:'<p>Practical rules that hold up: <b>length should scale with scope</b> (<code>i</code> in a three-line loop is fine, <code>d</code> as a module-level export is not); <b>name what it means, not how it is stored</b>; <b>keep one word per concept</b> across the codebase (never <code>fetch</code>, <code>get</code>, and <code>retrieve</code> for the same act); and <b>avoid negated booleans</b> — <code>isNotDisabled</code> will be misread.</p><p>Beyond individual names, a shared <b>ubiquitous language</b> — the same words in conversation, code, database, and UI — removes an entire class of translation bugs. When a name is contested, the underlying disagreement is nearly always about the model, not the word.</p>',
   rel:['decomposition','reading','requirements']},
  {id:'dry', term:'DRY — and when duplication is cheaper',
   plain:'Every fact should live in one place. But two things that merely look alike are not one fact.',
   gist:'The real rule is about knowledge, not characters: a business rule, a schema, a constant should have one authoritative home. Duplicated knowledge drifts, and drift is where bugs hide. But abstracting two coincidentally similar pieces of code fuses two independent things, and the next change to one will contort the shared abstraction.',
   why:'Generated code makes duplication nearly free to create and just as hard as ever to maintain. The judgment about which repetition is knowledge and which is coincidence is entirely yours.',
   deeper:'<p>Sandi Metz’s formulation is the useful one: <b>duplication is far cheaper than the wrong abstraction</b>. A premature abstraction accumulates flags and special cases until it is harder to read than the duplication it replaced, and by then it has many callers and cannot be removed.</p><p>Practical policy: duplicate freely on the first and second occurrence; on the third, look for the underlying concept and name it. And distinguish <b>essential</b> duplication (the same rule stated twice — always fix) from <b>incidental</b> duplication (similar shape, different reasons — usually leave alone).</p>',
   rel:['change','decomposition','simplicity']},
  {id:'layering', term:'Layering and the direction of dependencies',
   plain:'Dependencies should point one way — toward the stable, away from the volatile.',
   gist:'Arrange code so that arrows point inward: policy at the center (domain rules), mechanism at the edges (databases, HTTP, UI, third-party services). The domain must not import the database driver; the database adapter imports the domain’s interface. Then infrastructure becomes replaceable, and the rules stay testable in isolation.',
   why:'This is what makes a system durable while its parts churn. The frameworks and vendors at the edges will all be replaced; the business rules at the center are the asset.',
   deeper:'<p>The mechanism is <b>dependency inversion</b>: the inner layer defines the interface it needs (<code>OrderRepository</code>), the outer layer implements it (<code>PostgresOrderRepository</code>), and something at startup wires them together. Same idea, many names — hexagonal architecture, ports and adapters, clean architecture, onion architecture.</p><p>The payoff is concrete: the core can be tested with no database, an infrastructure swap touches one adapter, and the dependency graph is acyclic so you can reason about build and change order. The cost is indirection, and it is a genuine cost — apply it at boundaries that will actually move, not uniformly out of doctrine.</p>',
   rel:['coupling','graphs','monolith']},
  {id:'change', term:'Designing for change (and YAGNI)',
   plain:'You cannot predict the future, so optimize for being able to change your mind cheaply.',
   gist:'Two failure modes bracket this. Over-engineering builds elaborate flexibility for requirements that never arrive, and the abstraction is always wrong for the change that does come. Under-engineering hardcodes assumptions so deeply that any change is a rewrite. The way through is not prediction — it is keeping decisions reversible and deferring the irreversible ones.',
   why:'When implementation is cheap and fast to produce, the expensive mistakes are structural: the schema everyone depends on, the boundary drawn in the wrong place, the vendor woven through the core.',
   deeper:'<p>Sort decisions by reversibility. <b>Cheap to reverse</b> (an internal function’s shape, a library in one module): decide fast, move on. <b>Expensive to reverse</b> (public API shape, data model, service boundaries, storage engine): slow down, prototype, write it down, ask what unwinding it would cost.</p><p><b>YAGNI</b> — you aren’t gonna need it — is the right default for features and configuration knobs. It is <em>not</em> a license to skip boundaries in the places above. The synthesis: build the simplest thing that works, but place your seams where you already know change happens (I/O, vendors, policy).</p>',
   rel:['tradeoffs','simplicity','adr']},
],
  ex:[
  {id:'x-seams', title:'Find the seams in a 300-line function', time:'50 min', level:'Keystone',
   plain:'Take one long function — yours or a model’s — and decompose it on paper before touching it.',
   steps:'<li>Print or paste a genuinely long function. In the margin, label each block with the one thing it does. Blocks that need “and” are your first clue.</li><li>Mark every input it reads and every effect it causes (I/O, mutation, globals). Draw a line between the pure decision-making and the effects.</li><li>Propose three to five named units with explicit contracts — inputs, outputs, and what each promises. Write the signatures only; no bodies yet.</li><li>Now implement it. Notice that once the seams and contracts exist, the bodies are the easy part — and the part you could hand to anyone.</li>',
   hint:'<p>If a proposed unit needs six parameters, the cut is probably in the wrong place. Try grouping the parameters that always travel together — that group is usually a missing concept with a name.</p>',
   rel:['decomposition','contracts','purity']},
  {id:'x-contract', title:'Write the interface first', time:'40 min', level:'Hands-on',
   plain:'Specify a component completely enough that someone else could implement it correctly.',
   steps:'<li>Pick a real component you need — a rate limiter, a retry policy, a price calculator.</li><li>Write only the interface: operations, types, and for each one a written precondition, postcondition, and error behavior. No implementation.</li><li>Hand the contract to someone else (or to a model, in a fresh session with no other context) and have them implement it.</li><li>Compare what came back against your contract. Every disagreement is a gap in your specification, not a failure of the implementer. Fix the contract and repeat.</li>',
   hint:'<p>The gaps are almost always in the boring parts: what happens on empty input, on concurrent calls, on the boundary value, on the second call with the same arguments. Those are the clauses that matter.</p>',
   rel:['contracts','llmreview','spec']},
  {id:'x-illegal', title:'Make an illegal state unrepresentable', time:'35 min', level:'Hands-on',
   plain:'Delete a class of bugs permanently by changing the type instead of adding a check.',
   steps:'<li>Find a type in your code with fields that are only valid in certain combinations — a status string plus a nullable <code>cancelledAt</code>, or a flag plus an optional payload.</li><li>List the states the current type allows, then the states that are actually legal. The difference is your bug surface.</li><li>Redesign it so the illegal combinations cannot be constructed: a sum type / tagged union, a private constructor with a validating factory, or a dedicated non-empty or non-negative wrapper type.</li><li>Delete the now-impossible runtime checks and count them. That count is what the type bought you.</li>',
   rel:['invariants','types','static']},
  {id:'x-three-designs', title:'Three designs, one feature', time:'60 min', level:'Keystone',
   plain:'Practise the actual senior skill: generating alternatives and arguing them honestly.',
   steps:'<li>Take a feature you are about to build. Sketch three genuinely different designs at one page each — not variations, different shapes (e.g. synchronous in-process, queued and asynchronous, and derived-on-read).</li><li>For each, write: what becomes easy, what becomes hard, what it costs to reverse, and what has to be true for it to be the right choice.</li><li>Pick one and write down the two conditions that would make you switch to another.</li><li>Keep the page. When the requirement changes in six months, you will already have thought about it — and you will find out which of your predictions were wrong, which is how design judgment is actually built.</li>',
   rel:['tradeoffs','adr','change']},
]},
{
  numeral:'IV', slug:'data', title:'Data & Persistence',
  desc:'Code is replaceable; data is not. The schema you choose outlives the language, the framework, and usually the team — which makes this the least forgiving chapter.',
  topics:[
  {id:'modeling', term:'Data modeling',
   plain:'Naming the things your domain contains and the relationships between them.',
   gist:'Before tables or types, you decide what exists: entities (Order, Customer), their attributes, and how they relate — one-to-one, one-to-many, many-to-many. Get this right and features fall out naturally; get it wrong and every feature fights the model, forever, in ways no amount of clean code repairs.',
   why:'The data model is the most expensive thing in the system to change and the thing most often decided in the first week. It deserves more of your attention than any implementation choice.',
   deeper:'<p><b>Normalization</b> means each fact lives in exactly one place, so it cannot become inconsistent. The normal forms are formalizations of that one idea. <b>Denormalization</b> deliberately duplicates data for read speed, accepting the obligation to keep copies in sync — a legitimate trade, but a trade.</p><p>Two modelling habits that pay off for years: <b>record events, not just current state</b> (store that a refund happened at a time for a reason, not only that the status is now <code>refunded</code>) — you can always derive current state from history but never the reverse. And <b>be explicit about identity</b>: what makes two rows the same thing, and does that identity survive a name change, a merge, or a re-import?</p>',
   rel:['relational','sourceoftruth','types']},
  {id:'relational', term:'Relational databases and SQL',
   plain:'Tables, rows, and a declarative language for asking questions about them.',
   gist:'The relational model stores data in tables and lets you state <em>what</em> you want rather than how to get it; a query planner works out the how. Add constraints (primary keys, foreign keys, unique, not-null, check) and the database itself enforces your invariants — even against buggy application code, a stray script, or a manual fix at 2am.',
   why:'SQL is the most durable skill in this guide. It has outlived every ORM built to avoid it, and it is the layer where correctness can be enforced for everyone at once.',
   deeper:'<p>Concepts worth true fluency: <b>joins</b> (and why an accidental cross join returns nine million rows), <b>GROUP BY</b> with aggregates, <b>window functions</b> (ranking and running totals without self-joins), and <b>CTEs</b> for readable multi-step queries. Together they replace a startling amount of application code — and run next to the data instead of dragging it across a network.</p><p>ORMs are a legitimate convenience and a classic leaky abstraction. Know what SQL yours emits, especially the <b>N+1 query</b>: a loop over parents that fires one query per child. It is the single most common performance bug in web applications, and it is invisible until you look at the query log.</p>',
   rel:['indexes','transactions','abstraction']},
  {id:'indexes', term:'Indexes',
   plain:'A sorted side-structure that turns a full scan into a lookup — and slows every write.',
   gist:'Without an index the database reads every row to find the matching ones. An index (usually a B-tree) keeps a sorted copy of one or more columns with pointers back to the rows, converting O(n) scans into O(log n) seeks. The price is real: every insert and update must also maintain every index, and each one consumes storage and memory.',
   why:'“The database is slow” is, more often than anything else, a missing index or an index the query cannot use. Ten minutes of reading a query plan routinely beats a week of application optimization.',
   deeper:'<p>The rules that explain most surprises. <b>Column order in a composite index matters</b>: an index on (a, b) serves queries filtering on a, or a and b — but not b alone. <b>Wrapping a column in a function defeats the index</b> (<code>WHERE lower(email) = …</code> needs an expression index). <b>Low-selectivity columns are poor index candidates</b> — an index on a boolean rarely helps. And a <b>covering index</b> that contains every column the query needs avoids touching the table at all.</p><p>Always confirm with <code>EXPLAIN ANALYZE</code> rather than intuition: it tells you what the planner actually chose, how many rows it expected, and how many it found. A large gap between estimate and reality usually means stale statistics.</p>',
   rel:['trees','measure','relational']},
  {id:'transactions', term:'Transactions and ACID',
   plain:'A group of operations that either all happen or none do.',
   gist:'A transaction gives you four guarantees. Atomicity: all-or-nothing, so a crash mid-way leaves no half-transfer. Consistency: constraints hold at the boundaries. Isolation: concurrent transactions do not see each other’s partial work. Durability: once committed, it survives a power cut. These are the strongest correctness guarantees available anywhere in your stack — use them.',
   why:'Almost every “impossible” data corruption story is a missing transaction boundary or a multi-step operation that was assumed to be atomic and was not.',
   deeper:'<p>The practical skill is choosing <b>boundaries</b>: everything that must be consistent together belongs in one transaction, and nothing else should be. Long transactions hold locks and block others; transactions that wrap network calls to third parties are a classic outage.</p><p>The hard case is state that spans systems — charge the card and record the order. There is no distributed transaction available to you in practice, so the standard answers are the <b>outbox pattern</b> (write the intent to send in the same transaction as the data, deliver it separately) and <b>sagas</b> (a sequence of steps each with a compensating undo). Both accept temporary inconsistency in exchange for being possible.</p>',
   rel:['isolation','idempotency','consistency']},
  {id:'isolation', term:'Isolation levels and lost updates',
   plain:'Concurrent transactions interfere in specific, named ways. Your default level probably allows some.',
   gist:'Full serializability is expensive, so databases offer weaker levels — read committed, repeatable read, snapshot, serializable — each permitting particular anomalies: dirty reads, non-repeatable reads, phantoms, and write skew. Most databases default to read committed, under which the classic read-modify-write race silently loses updates.',
   why:'This is the highest-severity bug class that tests never catch: it needs concurrency to appear, so it shows up first in production, with money or inventory attached.',
   deeper:'<p>The canonical failure: two requests read a balance of 100, each subtract 30, each write 70. One update vanished. Three real fixes: do the arithmetic <b>in the database</b> (<code>SET balance = balance - 30</code> with a check constraint), take an explicit lock (<code>SELECT … FOR UPDATE</code>), or use <b>optimistic concurrency</b> — a version column, and an update that fails if the version moved.</p><p>Optimistic control scales better under low contention and pushes the conflict to the user (“this record changed since you loaded it”), which is often the honest answer. Under high contention, pessimistic locking is simpler — but watch for deadlocks and always acquire locks in a consistent order.</p>',
   rel:['transactions','races','idempotency']},
  {id:'migrations', term:'Schema migration and evolution',
   plain:'Changing the shape of live data while the old code is still running.',
   gist:'Schemas change constantly, but you cannot stop the world. Migrations must be versioned, ordered, repeatable, and above all <em>compatible with both the old and new code</em>, because during any deploy both are running at once. A migration that breaks the previous version turns a routine release into an outage with no rollback path.',
   why:'This is where careless changes cause irreversible damage. Code can be rolled back; a dropped column cannot.',
   deeper:'<p>The reliable technique is <b>expand and contract</b>, in separate deploys: (1) add the new column, nullable, and backfill in batches; (2) deploy code that writes both old and new; (3) deploy code that reads the new; (4) only once nothing references the old, drop it. Slow, boring, and it never takes the site down.</p><p>Operational hazards worth knowing: adding a column with a default or an index can lock a large table for minutes (use concurrent index builds), backfills should be chunked and throttled, and every migration should be tested against a realistic-size copy of production. Rehearse the rollback, not just the roll-forward.</p>',
   rel:['cicd','contracts','api']},
  {id:'nosql', term:'NoSQL and access-pattern-first design',
   plain:'Non-relational stores trade generality for a specific shape of speed and scale.',
   gist:'Document stores keep nested records that mirror your objects; key-value stores offer raw speed on a single lookup; wide-column stores scale writes across machines; graph databases traverse relationships natively; search engines invert text into terms. Each drops something — joins, transactions, ad-hoc querying — in exchange for what it is good at.',
   why:'The choice is not fashion. It is whether your access patterns are known and narrow (NoSQL can be excellent) or open-ended and evolving (relational usually wins, and wins again in year three).',
   deeper:'<p>The design inversion matters: in relational modelling you model the data and query it however you like later; in most NoSQL stores you model the <b>queries first</b> and shape storage to serve them. That is a strength when access patterns are stable and a trap when they change, because there is no query planner to rescue you.</p><p>The honest default for most applications is a relational database, which now handles JSON columns, full-text search, and considerable scale. Reach for a specialized store when you have a specific, measured reason — and expect to run both, which means you have signed up for keeping them consistent.</p>',
   rel:['modeling','consistency','tradeoffs']},
  {id:'caching', term:'Caching and invalidation',
   plain:'Keep a copy of an expensive answer near where it is needed. Then keep it honest.',
   gist:'Caching trades freshness for speed and load. It appears at every layer: CPU cache, memoized function, application cache, Redis, HTTP cache headers, CDN, browser. Adding a cache is easy and often dramatic. Deciding when the copy becomes wrong — and what a wrong answer costs — is the entire difficulty.',
   why:'A cache is a second source of truth you have volunteered to maintain. That is a real architectural commitment, and it is worth making deliberately rather than as a quick fix for a slow query.',
   deeper:'<p>Invalidation strategies, in rough order of safety: <b>TTL</b> (accept staleness for a bounded time — simplest and usually sufficient), <b>write-through</b> (update the cache with the data), <b>explicit invalidation</b> on change (correct until someone forgets a path), and <b>versioned keys</b> (change the key rather than delete the value — no stale reads possible).</p><p>Failure modes with names: <b>stampede</b> (a popular key expires and a thousand requests recompute it at once — fix with a lock or early recomputation), <b>cache penetration</b> (repeated misses for keys that do not exist — cache the negative too), and <b>silent divergence</b>, the worst one, where the cache has been wrong for weeks and nobody checks. Measure hit rate <em>and</em> correctness.</p>',
   rel:['io','consistency','sourceoftruth']},
  {id:'consistency', term:'Consistency models',
   plain:'“The data is correct” is not one thing. Choose which guarantee you actually need.',
