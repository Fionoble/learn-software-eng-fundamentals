/* ---------- state ---------- */
const LS_KEY='swefg-learned-v1', XS_KEY='swefg-workbench-v1';
let learned=new Set(JSON.parse(localStorage.getItem(LS_KEY)||'[]'));
let done=new Set(JSON.parse(localStorage.getItem(XS_KEY)||'[]'));
let current=0, query='';
const ALL=GUIDE.flatMap((c,ci)=>c.topics.map((t,ti)=>({...t,ci,ti})));
const ALLX=GUIDE.flatMap((c,ci)=>(c.ex||[]).map((x,xi)=>({...x,ci,xi,isEx:true})));
const byId=Object.fromEntries(ALL.map(t=>[t.id,t]));
ALLX.forEach(x=>{byId[x.id]=x});
const total=ALL.length, totalx=ALLX.length;

const nav=document.getElementById('nav');
const main=document.getElementById('main');
const searchEl=document.getElementById('search');

function save(){
  localStorage.setItem(LS_KEY,JSON.stringify([...learned]));
  localStorage.setItem(XS_KEY,JSON.stringify([...done]));
  pushProgress(); /* no-op unless this browser holds a sync token — see below */
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function renderNav(){
  nav.innerHTML=GUIDE.map((c,i)=>{
    const d=c.topics.filter(t=>learned.has(t.id)).length;
    return `<button data-ch="${i}" class="${i===current&&!query?'active':''}">
      <span class="numeral">${c.numeral}</span>
      <span class="t">${c.title}</span>
      <span class="n ${d===c.topics.length?'done':''}">${d}/${c.topics.length}</span>
    </button>`;
  }).join('');
  const n=learned.size;
  document.getElementById('ptext').textContent=`${n} / ${total}`;
  document.getElementById('pbar').style.width=(n/total*100)+'%';
  const nx=done.size;
  document.getElementById('xtext').textContent=`${nx} / ${totalx}`;
  document.getElementById('xbar').style.width=(totalx?nx/totalx*100:0)+'%';
}

function cardHTML(t,num){
  const open=t._open?'open':'', l=learned.has(t.id)?'learned':'';
  const rel=(t.rel||[]).filter(r=>byId[r]);
  return `<article class="card ${open} ${l}" id="card-${t.id}">
    <button class="card-head" data-toggle="${t.id}" aria-expanded="${!!t._open}">
      <span class="spec-id">${num}</span>
      <span class="headmain">
        <div class="term">${t.term}</div>
        <div class="plain">${t.plain}</div>
      </span>
      <span class="chev">▸</span>
    </button>
    <div class="card-body">
      <p class="gist">${t.gist}</p>
      ${t.why?`<div class="why"><b>Why it matters more now</b>${t.why}</div>`:''}
      ${t.deeper?`<details class="deeper"><summary>Go deeper</summary><div class="deep-body">${t.deeper}</div></details>`:''}
      <div class="card-foot">
        <button class="learn-btn" data-learn="${t.id}">${learned.has(t.id)?'Understood ✓':'Mark as learned'}</button>
        ${rel.length?`<div class="rel">${rel.map(r=>`<button data-goto="${r}">${byId[r].term||byId[r].title}</button>`).join('')}</div>`:''}
      </div>
    </div>
  </article>`;
}

function exHTML(x,num){
  const open=x._open?'open':'', l=done.has(x.id)?'learned':'';
  const rel=(x.rel||[]).filter(r=>byId[r]);
  return `<article class="card ex ${open} ${l}" id="card-${x.id}">
    <button class="card-head" data-toggle="${x.id}" aria-expanded="${!!x._open}">
      <span class="spec-id">${num}</span>
      <span class="headmain">
        <div class="term">${x.title}</div>
        <div class="plain">${x.plain}</div>
      </span>
      <span class="badges"><span class="badge">${x.time}</span><span class="badge">${x.level}</span></span>
      <span class="chev">▸</span>
    </button>
    <div class="card-body">
      <ol class="steps">${x.steps}</ol>
      ${x.hint?`<details class="deeper"><summary>Hint</summary><div class="deep-body">${x.hint}</div></details>`:''}
      <div class="card-foot">
        <button class="learn-btn" data-learn="${x.id}">${done.has(x.id)?'Done ✓':'Mark complete'}</button>
        ${rel.length?`<div class="rel">${rel.map(r=>`<button data-goto="${r}">${byId[r].term||byId[r].title}</button>`).join('')}</div>`:''}
      </div>
    </div>
  </article>`;
}

const exNum=(x)=>GUIDE[x.ci].numeral+'·W'+String(x.xi+1).padStart(2,'0');

function renderMain(){
  if(query){
    const q=query.toLowerCase();
    const hits=ALL.filter(t=>(t.term+' '+t.plain+' '+t.gist+' '+(t.why||'')+' '+(t.deeper||'')).toLowerCase().includes(q));
    const xhits=ALLX.filter(x=>(x.title+' '+x.plain+' '+x.steps+' '+(x.hint||'')).toLowerCase().includes(q));
    main.innerHTML=`<div class="chapter-head">
      <div class="kicker">Search</div>
      <h2>“${esc(query)}”</h2>
      <p>${hits.length} concept${hits.length===1?'':'s'} and ${xhits.length} exercise${xhits.length===1?'':'s'} found across the guide.</p>
    </div>
    <div class="cards">${hits.map(t=>cardHTML(t,GUIDE[t.ci].numeral+'·'+String(t.ti+1).padStart(2,'0'))).join('')||(xhits.length?'':'<p class="empty">Nothing in the guide matches that — yet.</p>')}</div>
    ${xhits.length?`<div class="fw-head"><div class="fw-kicker">Workbench</div></div>
    <div class="cards">${xhits.map(x=>exHTML(x,exNum(x))).join('')}</div>`:''}`;
  }else{
    const c=GUIDE[current];
    const prev=GUIDE[current-1], next=GUIDE[current+1];
    main.innerHTML=`<div class="chapter-head">
      <div class="kicker">Chapter ${c.numeral} · ${c.topics.length} concepts</div>
      <h2>${c.title}</h2>
      <p>${c.desc}</p>
    </div>
    <div class="cards">${c.topics.map((t,i)=>cardHTML(t,c.numeral+'·'+String(i+1).padStart(2,'0'))).join('')}</div>
    ${c.ex&&c.ex.length?`<div class="fw-head">
      <div class="fw-kicker">Workbench · ${c.ex.length} exercise${c.ex.length===1?'':'s'}</div>
      <h3>Now build something with it</h3>
      <p>Reading gives you the vocabulary; building gives you the judgment. Each exercise is sized for one sitting on the machine you already have.</p>
    </div>
    <div class="cards">${c.ex.map(x0=>{const x=byId[x0.id];return exHTML(x,exNum(x))}).join('')}</div>`:''}
    <div class="pager">
      ${prev?`<button data-nav="${current-1}"><span>← Previous</span>${prev.title}</button>`:'<span></span>'}
      ${next?`<button class="next" data-nav="${current+1}"><span>Next →</span>${next.title}</button>`:''}
    </div>`;
  }
  window.scrollTo({top:0});
}

function render(){renderNav();renderMain()}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-ch],[data-toggle],[data-learn],[data-goto],[data-nav]');
  if(!el)return;
  if(el.dataset.ch!==undefined){query='';searchEl.value='';current=+el.dataset.ch;render();}
  else if(el.dataset.nav!==undefined){current=+el.dataset.nav;render();}
  else if(el.dataset.toggle){const t=byId[el.dataset.toggle];t._open=!t._open;
    const card=document.getElementById('card-'+t.id);card.classList.toggle('open',t._open);
    el.setAttribute('aria-expanded',t._open);}
  else if(el.dataset.learn){const id=el.dataset.learn;const t=byId[id];
    const set=t.isEx?done:learned;
    set.has(id)?set.delete(id):set.add(id);save();
    const card=document.getElementById('card-'+id);card.classList.toggle('learned',set.has(id));
    el.textContent=set.has(id)?(t.isEx?'Done ✓':'Understood ✓'):(t.isEx?'Mark complete':'Mark as learned');
    renderNav();}
  else if(el.dataset.goto){const t=byId[el.dataset.goto];query='';searchEl.value='';
    current=t.ci;t._open=true;render();
    document.getElementById('card-'+t.id).scrollIntoView({behavior:'smooth',block:'center'});}
});

searchEl.addEventListener('input',()=>{query=searchEl.value.trim();renderMain();renderNav();});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==searchEl){e.preventDefault();searchEl.focus();}
  if(e.key==='Escape'&&query){query='';searchEl.value='';render();}
});
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('Clear all concept and workbench progress?')){learned.clear();done.clear();save();render();}
});

/* ---------- Raava sync (optional) ----------------------------------------
   Each completed unit can be pushed to a personal Ledger, where a scorer turns
   it into experience. The token is PASTED BY THE READER and lives only in this
   browser's localStorage: this file is public and carries no credential of any
   kind. With no token stored, nothing is ever sent anywhere. */
const SYNC_URL='https://republic-sync-hub.p-fio-noble.workers.dev/push';
const SYNC_GUIDE='sweng', SYNC_ORIGIN='learn:'+SYNC_GUIDE;
const TOKEN_KEY='learn_sync_token', SYNCED_KEY='swefg-synced-v1';
const syncBtn=document.getElementById('sync');
let syncedIds=new Set(JSON.parse(localStorage.getItem(SYNCED_KEY)||'[]'));
let syncing=false, syncAgain=false, syncNote='';

const syncToken=()=>localStorage.getItem(TOKEN_KEY)||'';
const syncDay=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

/* One op per unit that is complete but not yet pushed — which on the first
   connect is every unit already collected (the backfill). Un-completing a unit
   pushes nothing and deletes nothing: banked experience is never taken back. */
function syncOps(){
  const now=new Date(), day=syncDay(now), stamp=now.toISOString(), ops=[];
  for(const [kind,set] of [['concept',learned],['exercise',done]])
    for(const unit of set){
      const id=`learn:${SYNC_GUIDE}:${kind}:${unit}`;
      if(syncedIds.has(id))continue;
      ops.push({id,ns:'learn',collection:'progress',
        data:{id,guide:SYNC_GUIDE,kind,unit,date:day,timestamp:stamp},
        updatedAt:Date.now(),deletedAt:null,origin:SYNC_ORIGIN});
    }
  return ops;
}

function renderSync(){
  const on=!!syncToken();
  syncBtn.classList.toggle('on',on&&!syncNote&&!syncing);
  syncBtn.textContent=!on?'⚔ Sync progress to Raava'
    :syncNote?`⚔ ${syncNote}`
    :syncing?'⚔ syncing…'
    :'⚔ synced — disconnect';
}

/* An id is marked synced only once the hub confirms it, so a failed or offline
   push simply goes out again on the next completion or the next page load. */
async function pushProgress(){
  if(syncing){syncAgain=true;return}   /* a card marked mid-flight isn't lost */
  if(!syncToken())return;
  const ops=syncOps();
  if(!ops.length){renderSync();return}
  syncing=true;syncNote='';renderSync();
  try{
    const res=await fetch(SYNC_URL,{method:'POST',
      headers:{'content-type':'application/json','x-sync-token':syncToken()},
      body:JSON.stringify({ops})});
    if(!res.ok)syncNote=res.status===401||res.status===403?'sync token rejected':`sync failed (${res.status})`;
    else{
      const body=await res.json().catch(()=>({}));
      for(const r of body.results||[])
        if(r&&r.id&&(r.status==='applied'||r.status==='duplicate'))syncedIds.add(r.id);
      localStorage.setItem(SYNCED_KEY,JSON.stringify([...syncedIds]));
    }
  }catch(err){syncNote='sync offline — will retry'}
  syncing=false;renderSync();
  const again=syncAgain;syncAgain=false;
  if(again&&!syncNote)pushProgress(); /* a failure waits for the next load instead */
}

syncBtn.addEventListener('click',()=>{
  if(syncToken()){
    if(!confirm('Disconnect Raava sync? Progress stays in this browser.'))return;
    localStorage.removeItem(TOKEN_KEY);syncNote='';renderSync();return;
  }
  const t=(prompt('Paste your Raava sync token. It is stored only in this browser.')||'').trim();
  if(!t)return;
  localStorage.setItem(TOKEN_KEY,t);syncNote='';renderSync();pushProgress();
});

render();
renderSync();
pushProgress();
</script>
